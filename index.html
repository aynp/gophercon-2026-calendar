re types” from the spec, and support for recursive type constraints. Together, these changes unlock cleaner migrations, more expressive APIs, and patterns that simply did not work in earlier versions of Go.</p><p>Along the way, we’ll look at practical examples like type-safe ordered containers, fluent builders, and generic graph traversal, with an emphasis on what these features enable in real code, not type theory.</p><p>We’ll also discuss why the Go team introduced these capabilities gradually, what tradeoffs they were protecting against, and what these changes suggest about the future direction of generics in Go.</p><p>If you learned generics when they first arrived, this session will help you catch up on what’s changed, what’s now possible, and which patterns are finally ready for production use.</p>"}, {"i": 1880571, "t": "Go and {A}I Save the Bees", "s": 1785949200000, "e": 1785951000000, "sm": 600, "em": 630, "d": "2026-08-05", "r": "Finneran Ballroom 2", "rf": "Finneran Ballroom 2, Level 5, SCC | Summit", "c": "talk", "g": "Main Stage", "sp": [[44, "Speaker"]], "x": "<p>What if your distributed systems knowledge could literally help save honeybee colonies? Honeybees are facing critical population declines, and inspection records are essential for hive health, swarm response, and agricultural compliance - but managing them at scale is a distributed systems problem: async IoT events, AI inference, stateful long-running processes, and real-time alerting.</p><p>In this talk, I'll walk through a working beekeeping intelligence platform I built using Go, open-source tooling, and AI. You'll see how the workflow pattern enables reliable background processing, how workflow activities cleanly wrap AI vision and audio APIs to deliver actionable hive insights, and how IoT integrations trigger real-time alerts - like detecting a captured swarm from a sudden weight delta on a hive scale.</p><p>This isn't a toy demo. It's a live system running on real hives, generating AI-powered inspection reports, classifying bee temperament from audio, and supporting an agricultural tax exemption. Through live code and a working demo, you'll leave understanding how to combine workflows and AI APIs into a coherent, reliable system - with distributed systems patterns directly transferable to your day job. The domain changes, but the architecture doesn't.</p><p>Talk/Attendee Level: All Attendees</p>"}, {"i": 1801584, "t": "Morning Beverage Break", "s": 1785951000000, "e": 1785953700000, "sm": 630, "em": 675, "d": "2026-08-05", "r": "Signature Lounge area", "rf": "Signature Lounge/Lobby/Room, Level 5, SCC | Summit", "c": "food", "g": "Food & Breaks", "sp": [], "x": "<p>Freshly Brewed Regular and Decaffeinated Coffee<br>Hot Water with Assorted Teas<br>Served with Soy Milk, 2%, Skim, and Half &amp; Half, as well as assorted sweeteners</p><p>Fruit-Infused Water</p>"}, {"i": 1880572, "t": "Building Self-Optimizing Worker Pools in Go", "s": 1785953700000, "e": 1785955200000, "sm": 675, "em": 700, "d": "2026-08-05", "r": "Finneran Ballroom 2", "rf": "Finneran Ballroom 2, Level 5, SCC | Summit", "c": "talk", "g": "Main Stage", "sp": [[49, "Speaker"]], "x": "<p>Whether you are a new or experience Gopher, you may know that it's easy to build a simple worker pool using Go's built in concurrency primitives. A simple naive approach will get you a long way, but what if we could go deeper, and build a system that continuously optimizes itself by borrowing concepts from both mechanical engineering and biology?</p><p>In this talk, we will learn the basics of a worker pool, by building toward a real-world example of a worker pool pulling data from a remote system, then we will expose metrics that reveal import information about its performance, including the number of processed items, latency, error rate, CPU, and memory utilization.</p><p>Then we will lean into mechanical engineering concepts to build a PID (Proportional-Integral-Derivative). A PID is used for things like your car’s cruise control, or how your heat and air system responds to thermostat settings. For the purpose of this presentation, this concept will be used to control settings on the worker pool such as number of workers, batch size, and exponential backoff.</p><p>Finally, we will build a machine learning algorithm that responds to the metrics to optimize the worker pool settings during processing. For this we’ll use a set of evolutionary algorithms that respond to health signals from the worker pool’s exposed metrics.</p><p><strong>Talk/Attendee Level</strong>: All Attendees</p>"}, {"i": 1880672, "t": "Inside Out: Observing Go from Code to Kernel", "s": 1785955500000, "e": 1785957000000, "sm": 705, "em": 730, "d": "2026-08-05", "r": "Finneran Ballroom 2", "rf": "Finneran Ballroom 2, Level 5, SCC | Summit", "c": "talk", "g": "Main Stage", "sp": [[7, "Speaker"]], "x": "<p dir=\"ltr\">Do you really know what your Go program is doing in production? From OpenTelemetry traces to pprof profiles to eBPF kernel probes, we have more observability tools than ever but when should you use which one? Join Donia to see the different layers of your program, and how each comes with trade-offs in control, overhead, and depth.</p><p>In this talk, we will compare these three approaches and move from the inside of a Go application outward, from application-level traces to runtime behavior and finally to syscalls and network activity observed from the kernel. What does each layer actually reveal? What does it miss? And when should you reach for one over the others?</p><p>By the end, you will have a clear mental model of how Go programs behave across layers and a practical framework for choosing the right observability tool when debugging, optimizing, or investigating production issues.</p><p><strong>Talk/Attendee Level</strong>: Intermediate</p>"}, {"i": 1880591, "t": "Go Inside Microsoft: Scale, Security, and Upstream Collaboration", "s": 1785957300000, "e": 1785958800000, "sm": 735, "em": 760, "d": "2026-08-05", "r": "Finneran Ballroom 2", "rf": "Finneran Ballroom 2, Level 5, SCC | Summit", "c": "talk", "g": "Main Stage", "sp": [[51, "Speaker"]], "x": "<p>Go plays an increasingly central role inside Microsoft, powering cloud infrastructure, developer tooling, open-source projects, and internal services used at global scale.</p><p>But running Go inside a large platform company introduces challenges most teams never encounter: multi-architecture CI, operating system integration, evolving security and compliance requirements, and the responsibility of contributing meaningfully back to the upstream project.</p><p>In this session, I’ll share how Microsoft uses Go in practice, the kinds of engineering problems we’ve had to solve, and the contributions we’ve been making to the language and toolchain. I’ll also reflect on what happens when open-source software meets enterprise-scale expectations and why strong collaboration with the Go community is essential to making it work.</p><p>This is not a product talk. It’s an honest look at Go inside Microsoft, the trade-offs, the lessons learned, and what this experience might mean for the future of Go in large organizations.</p><p><strong>Talk/Attendee Level</strong>: All Attendees</p>"}, {"i": 1801589, "t": "Grab 'n Go Lunch", "s": 1785958800000, "e": 1785964800000, "sm": 760, "em": 860, "d": "2026-08-05", "r": "Signature Lounge area", "rf": "Signature Lounge & Lobby, Level 5, SCC | Summit", "c": "food", "g": "Food & Breaks", "sp": [], "x": "<p><strong>Pacific Northwest Bento Boxes&nbsp;</strong></p><p>House-smoked Chicken Bento Box - Smoked Chicken over a bed of Chopped Romaine | Quinoa and Grilled Asparagus Salad with White Balsamic Vinaigrette | Asian Summer Rolls with Sweet Thai Chili Sauce | Coconut Macaroon <strong>GF |&nbsp;</strong><strong>NF</strong></p><p>House-smoked Salmon Bento Box - Smoked Salmon over a bed of Chopped Romaine | Quinoa and Grilled Asparagus Salad with White Balsamic Vinaigrette | Asian Summer Rolls with Sweet Thai Chili Sauce | Coconut Macaroon <strong>GF |&nbsp;</strong><strong>NF</strong></p><p>Bean Salad Bento Box - Garbanzo, Kidney, and White Bean Salad over a bed of Chopped Romaine | Quinoa and Grilled Asparagus Salad with White Balsamic Vinaigrette | Asian Summer Rolls with Sweet Thai Chili Sauce | Grape Bunch <strong>GF | V |&nbsp;</strong><strong>NF</strong></p><p><br></p><p>Assorted Sodas and Canned Water</p>"}, {"i": 1938517, "t": "Sponsored Workshop: Build an AI Agent To Order a Cupcake (and Get One, Too!)", "s": 1785960000000, "e": 1785967200000, "sm": 780, "em": 900, "d": "2026-08-05", "r": "MR 437", "rf": "Meeting Room 437, Level 4, SCC | Summit", "c": "sponsor", "g": "Sponsor Sessions", "sp": [[51, "Host"], [26, "Host"]], "x": "<p>In this fun, self-paced hands-on workshop, <strong>you'll build an AI agent in Go using the Microsoft Agent Framework for Go</strong>. You'll connect it to a model deployed in Microsoft Foundry and enable it to interact with an MCP server hosted in Azure. Through a series of guided steps, you'll learn how agents connect to external tools and services to discover cupcake flavors, check inventory, and place orders.</p><p><strong>Seats are limited and available on a first-come, first-served basis</strong>, so be sure to arrive early and secure your spot. Cupcakes will be provided to workshop participants while supplies last.&nbsp;</p><p>Come learn how to build intelligent agents, connect them to real-world services, and enjoy a sweet reward for your success! 🧁</p>"}, {"i": 1801590, "t": "Lightning Talks", "s": 1785961500000, "e": 1785964800000, "sm": 805, "em": 860, "d": "2026-08-05", "r": "Finneran Ballroom 2", "rf": "Finneran Ballroom 2, Level 5, SCC | Summit", "c": "talk", "g": "Main Stage", "sp": [[39, "Emcee"], [25, "Emcee"], [14, "Speaker"], [22, "Speaker"], [0, "Speaker"], [16, "Speaker"], [18, "Speaker"], [17, "Speaker"], [19, "Speaker"]], "x": "<p dir=\"ltr\"><strong>The Life, Death, and Rebirth of testing/quick | Akshay Shah, Antithesis</strong></p><p dir=\"ltr\"><strong>Abstract:</strong> When the Go authors designed the standard library, they didn’t just include net/http, encoding/json, and basic testing - they also included testing/quick, a little-known package for property-based testing. In this talk, we’ll explore what property-based testing is, how to use testing/quick, and why the standard library package was eventually frozen.</p><p dir=\"ltr\"><strong>Talk/Attendee Level:</strong> Intermediate</p><p dir=\"ltr\"><br></p><p dir=\"ltr\"><strong>Three Simple Data Structures Built on Slices | Simon Law, Tailscale</strong></p><p dir=\"ltr\"><strong>Abstract:&nbsp;</strong>The humble slice is a familiar friend to any Go programmer. But did you know that you can build stacks, circular queues, and priority queues on top of a slice from memory? Amaze your friends and impress your colleagues as you do a little typing instead of importing a little dependency.</p><p dir=\"ltr\"><strong>Talk/Attendee Level:</strong> All Attendees</p><p dir=\"ltr\"><br></p><p><strong>Unix Pipes are Better Than Agents | Derick Schaefer</strong></p><p><strong>Abstract</strong>: The industry is racing to give LLMs more tools, APIs, and agent frameworks. Reserve, a Go CLI for exploring FRED macroeconomic data, takes the opposite approach: enabling the tool to explain itself. Every command can expose context, intent, examples, and pipeline patterns, allowing models to discover functionality, compose deterministic workflows, and explain exactly how a result was produced. Rather than letting an agent reason over commands, flags, and raw APIs, Reserve pushes collection, transformation, and analysis into deterministic, reproducible Unix pipelines, preserving precious tokens for insight rather than orchestration. The outcome is simpler, more transparent, and surprisingly powerful. The industry keeps asking how much intelligence can be embedded in upstream orchestration, while the Unix philosophy has spent the last fifty years moving orchestration into composition.</p><p><strong>Talk/Attendee Level</strong><strong>:&nbsp;</strong> All Attendees</p><p><br></p><p><strong>h.Sum(data) Does Not Hash Data | Ruslan Kadyrov, Mercari, Inc.</strong></p><p><strong>Abstract</strong>: In this lightning talk, I’ll walk through how I misunderstood Go’s hash.Hash interface, why the mistake looked perfectly reasonable, and what it reveals about Go’s API design. We’ll explore common hashing footguns, the difference between sha256.Sum256 and streaming hashers, and why small misunderstandings in low-level APIs can quietly produce incorrect behavior in production systems.</p><p><strong>Talk/Attendee Level</strong><strong>:</strong> All Attendees</p><p><br></p><p><strong>Hunting Dead Code in Production | Navneet Anand, Uber</strong></p><p><strong>Abstract</strong>: If your service is instrumented, you can ask it - at any moment, in any environment - what lines have actually executed. This talk shows how to build a coverage-driven dead-code detector for any Go service in roughly 100 lines of standard-library Go: an HTTP handler that snapshots counters on demand, a reset endpoint for time-windowed analysis, and a small unifier that merges profiles across multiple builds. I’ll close with the failure modes that turn a coverage signal into a confidence score, not a verdict.</p><p><strong>Talk/Attendee Level</strong><strong>:</strong> Intermediate</p><p><br></p><p><span data-sheets-root=\"1\"><strong>The Journey of Connecting Japan to the Global Go Community | Takuto Nagami, Chiba Institute of Technology</strong></span></p><p><strong>Abstract</strong>: Many Japanese Gophers dream of engaging with the global Go community, but language barriers often hold them back from taking the leap.</p><p>Through the Gophers EX project, I've spent the past year helping Japanese Gophers overcome those barriers and participate in international conferences as attendees or speakers. Along the way, we realized that true connection works both ways: it isn't just about sending people abroad, it's also about bringing the world to Japan.</p><p>In this lightning talk, I'll share that journey, what we learned from it, and how it eventually led to the launch of GopherCon Japan.</p><p><strong>Talk/Attendee Level</strong><strong>:</strong> All Attendees</p><p><br></p><p><strong>Experiment Report: sizespecializedmalloc | Michael Matloob, Google</strong></p><p><strong>Abstract</strong>:The sizespecializedmalloc GOEXPERIMENT will be enabled by default in Go 1.27. We’ll go over what it is and how we added it and how it should make memory allocation in your Go programs faster.</p><p><strong>Talk/Attendee Level:</strong> All Attendees</p>"}, {"i": 1880636, "t": "(Sync)testing Concurrent Code with Confidence", "s": 1785964800000, "e": 1785966300000, "sm": 860, "em": 885, "d": "2026-08-05", "r": "Finneran Ballroom 2", "rf": "Finneran Ballroom 2, Level 5, SCC | Summit", "c": "talk", "g": "Main Stage", "sp": [[15, "Speaker"]], "x": "<p>Testing concurrent code has always been a balance between tests being either hacky, flaky or slow. While the testing/synctest package made it possible for us to more effectively write idiomatic, easy-to-read tests for our concurrent programs that are both reliable and fast, it also came with a set of constraints.</p><p>In this talk, we’ll look at exactly what synctest can and cannot do, the underlying reasons behind its limitations, and how to avoid them. Finally, using a real-world example, we’ll see how proper use can push us towards robust system design we can feel confident about. In short, you’ll know precisely what to do to make the most of synctest, and why that will make your application code better.</p><p><strong>Talk/Attendee Level:</strong> All Attendees</p>"}, {"i": 1880637, "t": "Reimagining Plan 9 from Bell Labs for WebAssembly", "s": 1785966600000, "e": 1785968100000, "sm": 890, "em": 915, "d": "2026-08-05", "r": "Finneran Ballroom 2", "rf": "Finneran Ballroom 2, Level 5, SCC | Summit", "c": "talk", "g": "Main Stage", "sp": [[3, "Speaker"]], "x": "<p>Plan 9 from Bell Labs is the most influential operating system you've never used. Developed as the successor to Unix by the same team, Plan 9 explored how far a small set of carefully chosen abstractions could go: all system capabilities represented via the filesystem, customized per-process, and assembled from resources scattered across the network.</p><p>What if we took those core ideas and re-applied them to the web using Go and WebAssembly?</p><p>This talk will deconstruct and re-synthesize the design principles behind Plan 9. Rather than porting an operating system, we'll look at how its abstractions can be reimagined with Go as a modern software primitive that makes Plan 9's ideas usable and explorable in the browser and beyond.</p><p>Through stories and demos, attendees will learn:<br>- What made Plan 9's abstractions so radical, and why they still matter<br>- Why Go and WebAssembly are uniquely good for revisiting these ideas<br>- How we can finally bridge the world of Unix and the web</p><p>No prior experience with Plan 9 or WebAssembly is required, just an interest in building systems that are thoughtfully designed and built to last.</p><p><strong>Talk/Attendee Level</strong>: All Attendees</p>"}, {"i": 1938521, "t": "Sponsored Break: Gophers, Your Next Deployment is...Dessert!", "s": 1785967200000, "e": 1785970800000, "sm": 900, "em": 960, "d": "2026-08-05", "r": "MR 437", "rf": "Meeting Room 437, Level 4, SCC | Summit", "c": "sponsor", "g": "Sponsor Sessions", "sp": [], "x": "<p>Take a break from debugging, merge conflicts, and chasing down that one mysterious error message. Swing by the <strong>Microsoft Azure + GitHub Lounge</strong> for an afternoon <strong>Ice Cream Experience</strong> featuring cold treats, great conversations, and fellow Gophers. </p>"}, {"i": 1801593, "t": "Afternoon Beverage Break", "s": 1785968100000, "e": 1785969900000, "sm": 915, "em": 945, "d": "2026-08-05", "r": "Signature Lounge area", "rf": "Signature Lounge/Lobby/Room, Level 5, SCC | Summit", "c": "food", "g": "Food & Breaks", "sp": [], "x": "<p>Freshly Brewed Regular and Decaffeinated Coffee<br>Hot Water with Assorted Teas<br>Served with Soy Milk, 2%, Skim, and Half &amp; Half, as well as assorted sweeteners</p><p>Assorted Sodas and Sparkling Waters</p><p>Fruit-Infused Water</p>"}, {"i": 1880638, "t": "Unlocking Real-World Go Mutex Usage Patterns by Writing a Mutex Linter", "s": 1785969900000, "e": 1785971400000, "sm": 945, "em": 970, "d": "2026-08-05", "r": "Finneran Ballroom 2", "rf": "Finneran Ballroom 2, Level 5, SCC | Summit", "c": "talk", "g": "Main Stage", "sp": [[48, "Speaker"]], "x": "<p>The trickiest and hardest-to-identify bugs are often those fixable with a single line of code. Hours, days, or months can be spent only to find a missing Unlock() in the (dead) end. After I suffered such a case, I asked myself two questions: \"Am I using mutexes wrong?\" and \"How can I prevent bugs like this in the future?\"</p><p>The search for answers led me to the depths of static analysis and an exploration of Go mutex usage patterns in the wild.</p><p>In my talk, I want to share my findings and present a new linter for detecting mutex misuse.</p><p><strong>Talk/Attendee Level</strong><strong>:</strong> All Attendees</p>"}, {"i": 1880640, "t": "Pure-Go Tree-sitter: From Zero to Self-Hosted Infra with Oracles and Bench Gates", "s": 1785971700000, "e": 1785973200000, "sm": 975, "em": 1000, "d": "2026-08-05", "r": "Finneran Ballroom 2", "rf": "Finneran Ballroom 2, Level 5, SCC | Summit", "c": "talk", "g": "Main Stage", "sp": [[55, "Speaker"]], "x": "<p>Tree-sitter powers syntax highlighting, navigation, and code intelligence across modern editors. But in Go, using it usually means bringing C along for the ride. That is fine until you cross-compile, target WASM, or try to ship one clean static binary.<br><br>This talk is the story of building a pure-Go Tree-sitter runtime, and of learning how to trust it. Much of the implementation was AI-assisted, but the interesting part is not that an LLM wrote code. The interesting part is the harness around it: parity checks against the C runtime, benchmarks that catch fake wins, reproduction tests for every bug, and regression gates that force correctness to keep moving forward.</p><p>The runtime now supports hundreds of embedded grammars, hand-written external scanners, incremental parsing, queries, and a self-hosting grammar compiler. Full parses trade some raw speed for portability, while common editor-style incremental workloads can be dramatically faster than the C path.</p><p>Come for the parser internals; stay for the practical lessons on using LLMs in serious systems code without handwaving. This is a case study in moving quickly while keeping evidence close enough to know when the code is actually getting better.</p><p><strong>Talk/Attendee Level</strong>: All Attendees/Intermediate</p>"}, {"i": 1880647, "t": "The Anatomy of Go Vulnerabilities", "s": 1785973500000, "e": 1785975000000, "sm": 1005, "em": 1030, "d": "2026-08-05", "r": "Finneran Ballroom 2", "rf": "Finneran Ballroom 2, Level 5, SCC | Summit", "c": "talk", "g": "Main Stage", "sp": [[2, "Speaker"]], "x": "<p>Go doesn't have (particularly interesting) memory security vulnerabilities. So what do security issues in the Go toolchain, standard library, and the wider Go ecosystem look like?</p><p>Let's talk about what kind of security issues we've seen over the last five years, how we handle them, and what we can do to make Go an even safer language in the future.</p><p><strong>Talk/Attendee Level</strong>: All Attendees</p>"}, {"i": 1880649, "t": "State of TypeScript 7: Beyond the Port", "s": 1785975300000, "e": 1785976800000, "sm": 1035, "em": 1060, "d": "2026-08-05", "r": "Finneran Ballroom 2", "rf": "Finneran Ballroom 2, Level 5, SCC | Summit", "c": "talk", "g": "Main Stage", "sp": [[47, "Speaker"]], "x": "<p>Last year, we shared the story of TypeScript's port to Go. A lot has happened since then: we've shipped TypeScript 6.0 as a bridge release, watched our native preview grow past 5 million weekly downloads. The port is done, but the work didn't stop there.</p><p>In this talk, we'll go beyond the port itself. We'll cover the new API surfaces we've built on top of the Go codebase, including a snapshot-based language server, cross-language IPC, and Wasm. We'll talk about how the community has adopted the new compiler, how we've ensured stability at scale, and what surprises and compromises came up along the way. We'll also share our continued experience writing Go; where the language and toolchain have gotten better for us, and where they sometimes haven't.</p><p><strong>Talk/Attendee Level</strong>: Intermediate</p>"}, {"i": 1801574, "t": "RainGo Connection Meetup🌈", "s": 1785985200000, "e": 1785992400000, "sm": 1200, "em": 1320, "d": "2026-08-05", "r": "Off-site venues", "rf": "Union Seattle, 1009 East Union Street", "c": "social", "g": "Evening & Off-site", "sp": [[30, "Host"], [31, "Host"], [53, "Host"]], "x": "<p><em><strong>This gathering is included in your conference pass. If you are interested in attending, please&nbsp;</strong></em><a href=\"https://forms.gle/fHuQeNCQiLrxSm9w7\" rel=\"noopener noreferrer\" target=\"_blank\"><em><strong>register your interest</strong></em></a> <em><strong>so we can expect you.&nbsp;</strong></em></p><p>Join us at Union Seattle for an evening of connection and community with fellow RainGo members and allies! Located in the heart of Capitol Hill, Seattle's historic queer neighborhood, Union is known for its welcoming atmosphere, lively energy, and strong community roots.</p><p>Whether you're planning to catch up with old friends, make new connections, or simply enjoy a great night out, come as you are and get ready for a memorable evening filled with laughter, friendship, and plenty of pride. 🏳️‍🌈✨💖</p>"}, {"i": 1936162, "t": "Microsoft Azure + GitHub Lounge", "s": 1786028400000, "e": 1786062600000, "sm": 480, "em": 1050, "d": "2026-08-06", "r": "MR 437", "rf": "Meeting Room 437, Level 4, SCC | Summit", "c": "ambient", "g": "Main Stage", "sp": [], "x": "<p>Take a break and connect with the experts! Visit the Microsoft Azure + GitHub Lounge to speak with Microsoft specialists, explore the latest innovations, relax and recharge, and enjoy complimentary sweet treats throughout the event.</p><p><strong>Don't miss our hands-on workshops today from 10:00 a.m. - 12:00 p.m. &amp; <strong>1:00 p.m. - 3:00 p.m.</strong></strong></p><p><strong><em>** Seats are limited and available on a first-come, first-served basis**</em></strong></p><p>Whether you're looking for technical guidance, product insights, or a place to recharge between sessions, the Microsoft Azure + GitHub Lounge is your destination. We look forward to seeing you there!</p>"}, {"i": 1803669, "t": "Challenge Series: Welcome to the Jungle!", "s": 1786028400000, "e": 1786057200000, "sm": 480, "em": 960, "d": "2026-08-06", "r": "Olympic View Lounge", "rf": "Olympic View Lounge, Level 5, SCC | Summit", "c": "ambient", "g": "Main Stage", "sp": [[29, "Host"], [34, "Host"], [44, "Host"], [42, "Host"], [22, "Host"]], "x": "<p><em><strong>This activity is included in your conference pass. <em><strong>Interested in participating? Contestant&nbsp;</strong></em></strong></em><a href=\"https://gophercon.challengeseries.org/\" rel=\"noopener noreferrer\" target=\"_blank\"><em><strong><em><strong>registration</strong></em></strong></em></a><em><strong><em><strong>&nbsp;is now open!</strong></em></strong></em></p><p>Whether it's a Unix system that you (think) you know, the magic word that you forgot to say, or some amphibian DNA that corrupted your DNS - There's no end to the potential problems you might need to solve for this year's Challenge Series!&nbsp;</p><p>Focused on the world of Jurassic Park, your expedition to Isla Nublar will give you the opportunity to fix power outages, run from a T-Rex, and help security doors become secure once more.&nbsp;As with every year, we'll have an array of&nbsp;<a href=\"https://gophercon.challengeseries.org/prizes\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>prizes</strong></a> for all of you dinosaur-wranglers to fight over - Just don't let the dinosaurs fight over you instead.&nbsp;</p><p>While every contestant has the chance to win some prizes, the most competitive are the ones who hunt their challenges like a pack of velociraptors. And finally, don't forget to pack your can of Barbasol, you'll need something to bring your prized dinosaur embryos home in.&nbsp;</p><p>Be clever. Win prizes.</p><p>Keep an eye out in the <a href=\"https://gophers.slack.com/archives/C0528UE9X\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>#gophercon</strong></a> and <a href=\"https://gophers.slack.com/archives/C05KD83LQD8\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>#gophercon-cs</strong></a> channels in Gophers Slack for more updates up to and through the conference.</p>"}, {"i": 1803663, "t": "Hallway Track", "s": 1786028400000, "e": 1786062600000, "sm": 480, "em": 1050, "d": "2026-08-06", "r": "Overlook / Olympic View", "rf": "Overlook & Olympic View, Level 5, SCC | Summit", "c": "ambient", "g": "Main Stage", "sp": [], "x": "<p>Some say this is where the magic happens at GopherCon! Join your fellow Gophers for some informal socializing and networking between or during sessions, and find out for yourself. 😊</p>"}, {"i": 1803675, "t": "Coffee with the Exhibitors", "s": 1786028400000, "e": 1786035600000, "sm": 480, "em": 600, "d": "2026-08-06", "r": "Signature Lounge area", "rf": "Signature Lounge/Lobby/Room, Level 5, SCC | Summit", "c": "food", "g": "Food & Breaks", "sp": [], "x": "<p>Freshly Brewed Regular and Decaffeinated Coffee<br>Hot Water with Assorted Teas<br>Served with Soy Milk, 2%, Skim, and Half &amp; Half, as well as assorted sweeteners</p>"}, {"i": 1803662, "t": "GopherCon Exhibition", "s": 1786028400000, "e": 1786062600000, "sm": 480, "em": 1050, "d": "2026-08-06", "r": "Signature Lounge area", "rf": "Signature Lounge/Lobby/Room, Level 5, SCC | Summit", "c": "ambient", "g": "Main Stage", "sp": [], "x": ""}, {"i": 1801604, "t": "Attendee Services & Gopher Gear Shop", "s": 1786028400000, "e": 1786064400000, "sm": 480, "em": 1080, "d": "2026-08-06", "r": "Signature Lounge area", "rf": "Signature Lounge, Level 5, SCC | Summit", "c": "ambient", "g": "Main Stage", "sp": [], "x": ""}, {"i": 1803644, "t": "Welcome Back Gophers!", "s": 1786032000000, "e": 1786032300000, "sm": 540, "em": 545, "d": "2026-08-06", "r": "Finneran Ballroom 2", "rf": "Finneran Ballroom 2, Level 5, SCC | Summit", "c": "talk", "g": "Main Stage", "sp": [[39, "Emcee"], [40, "Emcee"]], "x": ""}, {"i": 1880651, "t": "The Go Cryptography State of the Union", "s": 1786032300000, "e": 1786033800000, "sm": 545, "em": 570, "d": "2026-08-06", "r": "Finneran Ballroom 2", "rf": "Finneran Ballroom 2, Level 5, SCC | Summit", "c": "talk", "g": "Main Stage", "sp": [[45, "Speaker"]], "x": "<p>The world of cryptography is undergoing changes faster than it ever did in most of our careers, but the Go cryptography maintainers are working to keep your applications secure with the least possible amount of disruption.</p><p>We’ll talk about our new ML-DSA package and how we test it, about how we are preparing for the post-quantum transition, about the new HPKE package, about randomness and entropy, about secure erasure of ephemeral secrets with runtime/secret, and about a nuanced and complex security issue in crypto/tls we’ve had to deal with.</p><p>This is your yearly appointment to learn about the progress of Go’s cryptography libraries, and the techniques we use to maintain them.</p><p><strong>Talk/Attendee Level</strong>: All Attendees</p>"}, {"i": 1880652, "t": "What slog Left on the Table", "s": 1786034100000, "e": 1786035600000, "sm": 575, "em": 600, "d": "2026-08-06", "r": "Finneran Ballroom 2", "rf": "Finneran Ballroom 2, Level 5, SCC | Summit", "c": "talk", "g": "Main Stage", "sp": [[54, "Speaker"]], "x": "<p>In 2023, Go 1.21 officially introduced the&nbsp;log/slog&nbsp;package, real structured logging in the standard library that many of us had been waiting years for. It covers the fundamentals well, but there are gaps that can become painful in real-world, large-scale systems. This talk explores two extensions, built on the&nbsp;slog.Handler&nbsp;interface, that fill some of those gaps. Some Gophers might even argue they should be part of the&nbsp;log/slog&nbsp;package itself.</p><p>First, a custom slog.Handler implementation that integrates slog with testing.T, routing the logs to the test's output. This has the nice effect of suppressing log noise during passing tests while surfacing full \"production\" logs on failure. We will cover the handler code itself, then dive into several tricky edge cases and how they were addressed.</p><p>Second, a dynamic per-component log leveling system that lets you change the log verbosity for individual components or subsystems at runtime, with no restarts and no performance penalty. If you've ever enabled DEBUG logging for your service to troubleshoot an issue and been buried in an avalanche of logs completely obscuring the ones you care about, you won't want to miss this.</p><p><strong>Talk/Attendee Level</strong>: All Attendees</p>"}, {"i": 1938518, "t": "Sponsored Workshop: Build an AI Agent To Order a Cupcake (and Get One, Too!)", "s": 1786035600000, "e": 1786042800000, "sm": 600, "em": 720, "d": "2026-08-06", "r": "MR 437", "rf": "Meeting Room 437, Level 4, SCC | Summit", "c": "sponsor", "g": "Sponsor Sessions", "sp": [[51, "Host"], [26, "Host"]], "x": "<p>In this fun, self-paced hands-on workshop, <strong>you'll build an AI agent in Go using the Microsoft Agent Framework for Go</strong>. You'll connect it to a model deployed in Microsoft Foundry and enable it to interact with an MCP server hosted in Azure. Through a series of guided steps, you'll learn how agents connect to external tools and services to discover cupcake flavors, check inventory, and place orders.</p><p><strong>Seats are limited and available on a first-come, first-served basis</strong>, so be sure to arrive early and secure your spot. Cupcakes will be provided to workshop participants while supplies last.&nbsp;</p><p>Come learn how to build intelligent agents, connect them to real-world services, and enjoy a sweet reward for your success! 🧁</p>"}, {"i": 1880653, "t": "Parsing Protobuf as Fast as Possible", "s": 1786035900000, "e": 1786037400000, "sm": 605, "em": 630, "d": "2026-08-06", "r": "Finneran Ballroom 2", "rf": "Finneran Ballroom 2, Level 5, SCC | Summit", "c": "talk", "g": "Main Stage", "sp": [[53, "Speaker"]], "x": "<p>Protobuf is an extremely popular binary data interchange format. This session dives into hyperpb, a Protobuf parser for Go that uses every trick in the book, and some new ones, to achieve the highest throughout possible. We'll talk about table-driven parsing, the parser paradigm used by hyperpb, and hyperpb's innovations on the concept. We'll also take a look at the high-level architecture of hyperpb, including its compiler, parser VM, and layout optimizations.</p><p><strong>Talk/Attendee Leve</strong>l: Advanced</p>"}, {"i": 1801610, "t": "Morning Beverage Break", "s": 1786037400000, "e": 1786040100000, "sm": 630, "em": 675, "d": "2026-08-06", "r": "Signature Lounge area", "rf": "Signature Lounge/Lobby/Room, Level 5, SCC | Summit", "c": "food", "g": "Food & Breaks", "sp": [], "x": "<p>Freshly Brewed Regular and Decaffeinated Coffee<br>Hot Water with Assorted Teas<br>Served with Soy Milk, 2%, Skim, and Half &amp; Half, as well as assorted sweeteners</p><p>Fruit-Infused Water</p>"}, {"i": 1880654, "t": "From Go to Factorio: What Games Can Teach Us About Compilers", "s": 1786040100000, "e": 1786041900000, "sm": 675, "em": 705, "d": "2026-08-06", "r": "Finneran Ballroom 2", "rf": "Finneran Ballroom 2, Level 5, SCC | Summit", "c": "talk", "g": "Main Stage", "sp": [[4, "Speaker"]], "x": "<p>Go's compiler quietly transforms every program into a form most developers never see. What if you could not just see it, but play with it? This talk turns a hidden layer of Go into a living, ticking factory. The factory must grow.</p><p><strong>Talk/Attendee Level</strong>: All Attendees</p>"}, {"i": 1880657, "t": "Sandboxing DuckDB with io/fs", "s": 1786041900000, "e": 1786043400000, "sm": 705, "em": 730, "d": "2026-08-06", "r": "Finneran Ballroom 2", "rf": "Finneran Ballroom 2, Level 5, SCC | Summit", "c": "talk", "g": "Main Stage", "sp": [[1, "Speaker"]], "x": "<p>Go programs that embed C libraries face a hidden trap: the C library brings its own I/O stack. It doesn't know about your credentials, your TLS configuration, your request tracing, or your retry logic. It just reaches out to the network or disk on its own terms. You end up with two parallel I/O systems in the same binary, and they will drift apart in ways that are hard to debug and expensive to maintain.</p><p>DuckDB is a great example. It is one of the most useful embedded databases available today, and many Go programs are starting to use it. But DuckDB ships extensions like httpfs and aws that perform network I/O directly from C++. If your Go program wraps those extensions, you have lost observability, lost credential management, and lost the ability to apply standard Go middleware to the database's I/O operations.</p><p>The solution is simpler than it looks. Go's io/fs interface, introduced in 1.16, gives us a clean, composable abstraction for read-only file systems. Most C libraries that do I/O support some form of virtual file system hook. If you can connect those two things, you can route all of the library's I/O back through the Go runtime, and suddenly every cloud SDK, every telemetry wrapper, every retry policy you have already written becomes available to the database too.</p><p>This talk teaches you how to do that. We will walk through the split stack problem in concrete terms, look at how DuckDB's virtual file system API works, and build a mental model of the bridge: a small C++ extension that intercepts DuckDB's file operations and forwards them to a Go function that satisfies io/fs. By the end, you will understand the pattern well enough to apply it to other C libraries, and you will learn about an open-source library that does it for DuckDB today.</p><p><strong>Talk/Attendee Level:</strong> Advanced</p>"}, {"i": 1880573, "t": "Receipts from the Go Linker: Auditing the Cost of Dependencies", "s": 1786043700000, "e": 1786045200000, "sm": 735, "em": 760, "d": "2026-08-06", "r": "Finneran Ballroom 2", "rf": "Finneran Ballroom 2, Level 5, SCC | Summit", "c": "talk", "g": "Main Stage", "sp": [[52, "Speaker"]], "x": "<p>Every import statement is a transaction, but most of us never check the receipt.&nbsp;</p><p>In this talk, we'll follow your dependencies from <span style=\"color: rgb(65, 168, 95);\">go.mod</span> all the way to compiled symbols, uncovering what the Go linker actually pulls into your binary, where Dead Code Elimination saves you, and where it fails. Along the way, we'll expose the patterns secretly inflating your binary size and explain why that bloat even matters.&nbsp;</p><p>Whether you're a library maintainer, a product engineer, or both, you'll walk away with a toolkit for evaluating dependencies so your binaries stay lean.</p><p><strong>Talk/Attendee Level</strong>: All Attendees</p>"}, {"i": 1801614, "t": "Lunch Service", "s": 1786045200000, "e": 1786050600000, "sm": 760, "em": 850, "d": "2026-08-06", "r": "Signature Lounge area", "rf": "Signature Lounge & Lobby, Level 5, SCC | Summit", "c": "food", "g": "Food & Breaks", "sp": [], "x": "<p><strong>Pacific Northwest Lunch Buffet</strong></p><p>Field Lettuce Salad with toasted Hazelnuts, and local-sourced Tomatoes with Agave-Beet Vinaigrette <strong>GF |&nbsp;</strong><strong>V | DF</strong></p><p>Assorted Rolls &amp; Butter<strong>&nbsp;Veg</strong></p><p>House-smoked Salmon with Cherry, Apple and Fennel Salad<strong>&nbsp;GF |NF | DF</strong></p><p>Walla Walla Sweet Onion Ravioli with Beecher's Flagship Cheese Sauce <strong>Veg | NF</strong></p><p>Tri-Color Roasted Potatoes with fresh Herbs <strong>GF | V | NF | DF</strong></p><p>Grilled Eggplant Roll with Cannellini Stew and Tomato Basil Sauce <strong>GF | V | NF | DF</strong></p><p>Grilled Asparagus<strong>&nbsp;GF | V | NF | DF</strong></p><p>Espresso Cheesecake <strong>Veg | NF</strong></p><p>Black Forest Cake<strong>&nbsp;GF | V | NF | DF</strong></p><p><br></p><p>Iced Tea and Lemonade</p>"}, {"i": 1938519, "t": "Sponsored Workshop: Build an AI Agent To Order a Cupcake (and Get One, Too!)", "s": 1786046400000, "e": 1786053600000, "sm": 780, "em": 900, "d": "2026-08-06", "r": "MR 437", "rf": "Meeting Room 437, Level 4, SCC | Summit", "c": "sponsor", "g": "Sponsor Sessions", "sp": [[51, "Host"], [26, "Host"]], "x": "<p>In this fun, self-paced hands-on workshop, <strong>you'll build an AI agent in Go using the Microsoft Agent Framework for Go</strong>. You'll connect it to a model deployed in Microsoft Foundry and enable it to interact with an MCP server hosted in Azure. Through a series of guided steps, you'll learn how agents connect to external tools and services to discover cupcake flavors, check inventory, and place orders.</p><p><strong>Seats are limited and available on a first-come, first-served basis</strong>, so be sure to arrive early and secure your spot. Cupcakes will be provided to workshop participants while supplies last.&nbsp;</p><p>Come learn how to build intelligent agents, connect them to real-world services, and enjoy a sweet reward for your success! 🧁</p>"}, {"i": 1801615, "t": "Lightning Talks", "s": 1786047900000, "e": 1786050600000, "sm": 805, "em": 850, "d": "2026-08-06", "r": "Finneran Ballroom 2", "rf": "Finneran Ballroom 2, Level 5, SCC | Summit", "c": "talk", "g": "Main Stage", "sp": [[25, "Emcee"], [40, "Emcee"], [36, "Speaker"], [41, "Speaker"], [20, "Speaker"], [32, "Speaker"], [33, "Speaker"], [21, "Speaker"]], "x": "<p><strong>Perform Inference Directly in Your Go Applications with Kronk | Bill Kennedy, Ardan Labs</strong></p><p><strong>Abstract</strong>: Self-hosted inference — running models on hardware you control — means no per-token costs, no data leaving your environment, no vendor lock-in, and access to the long tail of open-source models that go well beyond the LLMs everyone is talking about. And contrary to popular belief, you don't need a GPU rack: small models like Qwen3.5-0.8B-Q8_0 run comfortably on the same laptop you're using right now. The hard part has been doing it from Go without CGO, Python, or a network hop to something like Ollama.<br><br>&nbsp;In this lighting talk I will show you how you can use Kronk to perform inference directly in your go applications.</p><p><strong>Talk/Attendee Level</strong><strong>:</strong> All Attendees</p><p><br></p><p><strong>A Small Update About TinyGo | Ron Evans, The Hybrid Group</strong></p><p><strong>Abstract</strong>: The latest and greatest about TinyGo, the Go compiler for the smallest of places.</p><p><strong>Talk/Attendee Level</strong><strong>:</strong> All Attendees</p><p><br></p><p><strong>Creating a full desktop environment with Go! | Andrew Williams, Apptrix.ai</strong></p><p><strong>Abstract:&nbsp;</strong>What if you could be using Go to build apps on your laptop - what if the entire desktop was written with Go? This presentation highlights the benefits and beauty of a desktop environment created purely with Go. This whistle-stop tour of a massive topic covers lots of tantalising details, providing some code snippets and lots of screenshots to illustrate the topic. We leave with a \"try it out and contribute\" call to action and a great reveal. 🙂</p><p><strong>Talk/Attendee Level:</strong> All Attendees</p><p><br></p><p dir=\"ltr\"><strong>Nip the Nits in the Bud | Garrett Denis, Skool</strong></p><p dir=\"ltr\"><strong>Abstract:</strong> Repeated \"nit\" comments - line wrapping, formatting, style preferences - are easy to follow but tedious to enforce by hand, and every one of them steals reviewer attention from correctness, design, and risk. In this lightning talk I'll turn one real nit from our codebase - enforcing one clause per line in boolean conditionals - into a custom Go linter using `go/analysis`, complete with an auto-fix and golangci-lint integration, in a single worked example. The point isn't the rule, it's that the &nbsp;pattern is repeatable. If a style choice is objective and recurring, it belongs in tooling, not a review thread. As AI assistants generate ever more code, codifying your team's conventions as lint rules is how you keep both humans and machines consistent - and keep review focused on what actually matters.</p><p dir=\"ltr\"><strong>Talk/Attendee Level:</strong> All Attendees</p><p dir=\"ltr\"><br></p><p><strong>AI is a Power-up, Not a Player | Seth Lumnah, Capital One</strong></p><p><strong>Abstract</strong>: I maintain shared Go libraries used across a large organization, and the bottleneck has never been code—it's attention. Proposals pile up, PRs wait for review, and community updates never get written because compiling them takes too long. So I started writing agent skills: markdown files that point an AI at our style guide and tell it how to handle routine work. This talk tours the skills I actually use, the discipline that keeps reviews honest, and the foundation work that any maintainer can start tomorrow. AI is a power-up, not a player.</p><p><strong>Talk/Attendee Level</strong><strong>:</strong>&nbsp; All Attendees</p><p><br></p><p><strong>Safer Agent Infrastructure: Don't Give the Agent Your Keys! | Marc Dougherty, Go Team, Google</strong></p><p><strong>Abstract</strong><strong>:</strong> AI agents today are desktop software, acting directly with a user's credentials. This has led to auth token leaks and unexpected behaviors that reach the news. How can you avoid making the headlines? Better authentication, and management of delegated credentials is the first step. Learn some tactics for keeping the keys away from your agents, and other ways to make your agent infrastructure more mature (and a bit safer!).</p><p><strong>Talk/Attendee Level</strong><strong>:</strong> Intermediate</p>"}, {"i": 1880691, "t": "Uber-Scale Changes: Managing Millions of Lines of Go", "s": 1786050600000, "e": 1786052100000, "sm": 850, "em": 875, "d": "2026-08-06", "r": "Finneran Ballroom 2", "rf": "Finneran Ballroom 2, Level 5, SCC | Summit", "c": "talk", "g": "Main Stage", "sp": [[5, "Speaker"]], "x": "<p>Uber's Go Monorepo has 100M lines of Go, and it's growing faster than ever, with thousands of Gophers writing code.&nbsp;</p><p>This talk highlights an essential part of maintaining such a large codebase - in particular, how our team makes \"Uber-scale changes\". Changes that span 10,000s of Go files in a large engineering organization, and how we automated that using AST transformation tools as well as AI.</p><p><strong>Talk/Attendee Level</strong>: Advanced</p>"}, {"i": 1880692, "t": "Detect, Trace, Fix: Bringing AI-Powered Taint Analysis to gosec", "s": 1786052400000, "e": 1786053900000, "sm": 880, "em": 905, "d": "2026-08-06", "r": "Finneran Ballroom 2", "rf": "Finneran Ballroom 2, Level 5, SCC | Summit", "c": "talk", "g": "Main Stage", "sp": [[8, "Speaker"]], "x": "<p>Go's tooling ecosystem is evolving beyond simply finding problems to automatically fixing them, but security analysis has lagged behind. In this session, we'll explore a new AI-ready taint analysis engine for gosec that traces untrusted data across an entire Go application, accurately detecting vulnerabilities&nbsp;such as SQL injection, command injection, path traversal, SSRF, XSS, and more.</p><p>Attendees will learn how SSA- and call graph-based analysis makes data flow tracking practical in Go, how these techniques dramatically reduce false positives, and how the same architecture can power automated and AI-assisted remediation. See where Go security tooling is headed: from detecting vulnerabilities to tracing, understanding, and fixing them before they reach production.</p><p><strong>Talk/Attendee Level</strong>: All Attendees</p>"}, {"i": 1938520, "t": "Sponsored Break: Gophers, Your Next Deployment is...Dessert!", "s": 1786053600000, "e": 1786057200000, "sm": 900, "em": 960, "d": "2026-08-06", "r": "MR 437", "rf": "Meeting Room 437, Level 4, SCC | Summit", "c": "sponsor", "g": "Sponsor Sessions", "sp": [], "x": "<p>Take a break from debugging, merge conflicts, and chasing down that one mysterious error message. Swing by the <strong>Microsoft Azure + GitHub Lounge</strong> for an afternoon <strong>Ice Cream Experience</strong> featuring cold treats, great conversations, and fellow Gophers. </p>"}, {"i": 1801618, "t": "Afternoon Beverage Break", "s": 1786053900000, "e": 1786055700000, "sm": 905, "em": 935, "d": "2026-08-06", "r": "Signature Lounge area", "rf": "Signature Lounge/Lobby/Room, Level 5, SCC | Summit", "c": "food", "g": "Food & Breaks", "sp": [], "x": "<p>Freshly Brewed Regular and Decaffeinated Coffee<br>Hot Water with Assorted Teas<br>Served with Soy Milk, 2%, Skim, and Half &amp; Half, as well as assorted sweeteners</p><p>Assorted Sodas and Sparkling Waters</p><p>Fruit-Infused Water</p>"}, {"i": 1880693, "t": "Automation Tools for Large-Scale Go Code Transformations", "s": 1786055700000, "e": 1786057200000, "sm": 935, "em": 960, "d": "2026-08-06", "r": "Finneran Ballroom 2", "rf": "Finneran Ballroom 2, Level 5, SCC | Summit", "c": "talk", "g": "Main Stage", "sp": [[10, "Speaker"]], "x": "<p>Maintaining velocity during large-scale code evolution requires moving beyond manual editing to automated, programmatic transformations. This presentation examines the techniques used to resolve complex merge conflicts and manage temporal LSCs, featuring case studies on refactoring the Go command’s module loader and the Go compiler's internal structures.</p><p><strong>Talk/Attendee Level</strong>: Intermediate</p>"}, {"i": 1880694, "t": "Chasing the Moon: Engineering a High-Performance Lua VM in Pure Go", "s": 1786057500000, "e": 1786059000000, "sm": 965, "em": 990, "d": "2026-08-06", "r": "Finneran Ballroom 2", "rf": "Finneran Ballroom 2, Level 5, SCC | Summit", "c": "talk", "g": "Main Stage", "sp": [[6, "Speaker"]], "x": "<p>Lua is widely used for embedded scripting, providing extensibility in systems such as Neovim, Redis, and Nginx. However, embedding C-based Lua implementations such as PUC Lua in Go introduces CGO build complexity and call overhead. Existing pure-Go implementations are easier to embed, but are typically 2–3 fold slower than PUC Lua and consume significantly more memory.&nbsp;</p><p>This talk introduces a new pure-Go, register-based Lua VM that achieves performance within 30–50% of PUC Lua while remaining fully CGO-free. Rather than focusing solely on VM internals, the session uses the VM as a case study in high-performance Go systems programming, covering techniques applicable far beyond interpreter design including memory layout optimization, GCpressure reduction, elimination of hidden allocations, and construction of cache-friendly data structures.&nbsp;</p><p>The talk will also demonstrate practical optimization workflows using Go benchmarks, CPU and memory profiling, escape analysis, and compiler inlining diagnostics.</p><p><strong>Talk/Attendee Level</strong>: All Attendees</p>"}, {"i": 1880695, "t": "Building a Durable Agent & MCP Execution Engine in Go", "s": 1786059300000, "e": 1786060800000, "sm": 995, "em": 1020, "d": "2026-08-06", "r": "Finneran Ballroom 2", "rf": "Finneran Ballroom 2, Level 5, SCC | Summit", "c": "talk", "g": "Main Stage", "sp": [[42, "Speaker"]], "x": "<p>AI agents can call tools, invoke APIs, and connect to remote systems through the Model Context Protocol (MCP). But most agentic frameworks aren't durable - if the process crashes mid tool call, execution is lost, context is gone, and the agent starts over from scratch. That’s costly. MCP makes this worse: a tool call isn't always a single round-trip. Servers can pause execution mid-call to request user input (aka elicitation) or trigger an LLM completion (aka sampling). Both of these are interactions that can suspend for minutes before resuming. A simple retry loop can't model these human interactions required, or the durability to resume the agent loop.</p><p>In this talk, we'll explore the fundamental building blocks backing our fully durable agent and MCP execution engine written in Go.&nbsp;We'll cover deterministic replay, checkpoint-based resumption, how the Virtual Actor pattern and Go’s primitives power the underlying durability engine, and how we embedded a transparent and built-in MCP durability worker.</p><p>You'll leave with a concrete understanding of what durable execution actually means and looks like in Go for Agents and MCP,&nbsp;and why it's the right foundation you need to run in production in the AI era that we find ourselves in today.</p><p><strong>Talk/Attendee Level</strong>: All Attendees</p>"}, {"i": 1880696, "t": "A Slice of Go's Future", "s": 1786060800000, "e": 1786063500000, "sm": 1020, "em": 1065, "d": "2026-08-06", "r": "Finneran Ballroom 2", "rf": "Finneran Ballroom 2, Level 5, SCC | Summit", "c": "talk", "g": "Main Stage", "sp": [[39, "Moderator"], [43, "Panelist"], [9, "Panelist"], [12, "Panelist"], [2, "Panelist"]], "x": "<p>The Go ecosystem is evolving rapidly, driven by shifts in governance, security, and the rise of artificial intelligence. In this final session of GopherCon 2026, join the Go Team for a panel discussion that will address the community’s biggest questions, including:</p><ul type=\"disc\"><li>A more open and scalable technical governance model that ensures the Go project’s longevity and adaptability to its community’s continuously changing needs.</li><li>How language preference and professional identity are evolving as AI tools proliferate in the industry.</li><li>The future of security with rapidly advancing AI models and concerns around post-quantum cryptography.</li></ul><p>Join the Go Team for a forward-looking, open discussion on the future of the project where your toughest questions will be answered.</p>"}], "speakers": [{"n": "Derick Schaefer", "t": "Software Engineer", "co": "", "im": "https://assets-ext.bizzabo.com/bizzaboprod/image/upload/c_crop,g_custom,f_auto/v1784085047/nqfbvcaosfbteargaqc3.jpg", "b": "Derick Schaefer is a technology leader, consultant, speaker, and author with more than 35 years of experience building enterprise software and leading engineering organizations. Introduced to Go in 2016, he has championed its adoption across SaaS companies for its simplicity, performance, and maintainability.\n\nHe is the author of CLI – A Practical Guide to Modern Command-Line Interfaces (https://moderncli.dev) and Integrating SaaS Acquisitions: A Technical Leader’s M&A Playbook. He is also an active open-source contributor, with projects including the RESERVE macroeconomics CLI, the PortableText package for Go, and Static Cache Wrangler for WordPress. Derick enjoys sharing practical lessons on Go, developer tooling, software design, and engineering leadership.", "li": "https://www.linkedin.com/in/derickschaefer/", "w": "https://reservecli.dev/"}, {"n": "Achille Roussel", "t": "Co-founder & CTO", "co": "Firetiger", "im": "https://assets-ext.bizzabo.com/bizzaboprod/image/upload/c_crop,g_custom,f_auto/v1779319295/tkbzsez0m16a61pwvmvv.jpg", "b": "Achille has worked as a software engineer on distributed systems since 2011, at both startups and large companies like Twitch, Facebook, Segment, and Twilio.\n\nHe has authored and participate in multiple open-source projects such as kafka-go, parquet-go, wazero, and also contributed the GOOS=wasip1 port of Go.\n\nIn 2024, Achille co-founded Firetiger to develop agents that help engineers manage their deployments, catalog issues, and apply remediations when defects make it to production.", "li": "https://www.linkedin.com/in/achille-roussel/", "w": "https://blog.firetiger.com"}, {"n": "Roland Shoemaker", "t": "Go Security Team Lead", "co": "Google, Go Team", "im": "https://assets-ext.bizzabo.com/bizzaboprod/image/upload/c_crop,g_custom,f_auto/v1780078917/mccyjgvbjr8ymujeqikb.jpg", "b": "Roland leads the Go Security team at Google, working on cryptography, transport security, vulnerability triage, and generally keeping Go secure. Before working on the Go team, he worked on the Let's Encrypt project building the certificate authority software which now issues millions of certificates each day.", "li": "", "w": ""}, {"n": "Jeff Lindsay", "t": "Founder", "co": "progrium", "im": "https://assets-ext.bizzabo.com/bizzaboprod/image/upload/c_crop,g_custom,f_auto/v1780080024/n5t5evdyqwhsofjt3oty.jpg", "b": "Jeff Lindsay is a builder and entrepreneur most known for his work and ideas in open-source developer tooling. From webhooks to Docker, Jeff has spent much of his career building and pioneering generative primitives that let developers do more with less.", "li": "https://www.linkedin.com/in/progrium/", "w": "https://progrium.xyz"}, {"n": "Simon Li", "t": "Software Engineer", "co": "Meta", "im": "https://assets-ext.bizzabo.com/bizzaboprod/image/upload/c_crop,g_custom,f_auto/v1780086473/tze16k8c9ruvu6ktwacj.jpg", "b": "Simon is a Software Engineer working on the Go Foundation Team at Meta. He focuses on developer experience, infrastructure, and tooling, with a background in platform engineering using Kubernetes, cloud networking, and Go.", "li": "https://www.linkedin.com/in/siutsin/", "w": "https://www.linkedin.com/in/siutsin/"}, {"n": "Sung Whang", "t": "Senior Staff Engineer, TLM", "co": "Uber", "im": "https://assets-ext.bizzabo.com/bizzaboprod/image/upload/c_crop,g_custom,f_auto/v1780624294/i99sdi1gpvjfgcapzlud.jpg", "b": "Sung leads the Go Platform team at Uber. He works on service frameworks, core libraries, static analysis tools, and Go developer experience tools that powers all of the 2,000+ Go services at Uber.\n\nPrior to Uber, Sung worked on the .NET CLR team at Microsoft.", "li": "https://www.linkedin.com/in/jameswhang/", "w": ""}, {"n": "Salah Mahmud", "t": "Director", "co": "Palliser Analytics", "im": "https://assets-ext.bizzabo.com/bizzaboprod/image/upload/c_crop,g_custom,f_auto/v1780964007/yoslkbic6mgpexk8oewb.jpg", "b": "Salah Mahmud began his career writing software before transitioning into medicine and clinical research. Now stepping back from active clinical practice, he combines both disciplines to build high-performance systems for the medical field, including tools to process massive health insurance datasets and screen for drug and vaccine adverse events in low-resource settings. Salah's work is shaped by the need to extract maximum performance from limited computational resources, which led to a deep interest in Go, compiler (DSL) design, and low-level optimization.", "li": "https://www.linkedin.com/in/salah-mahmud-4177285a/", "w": ""}, {"n": "Donia Chaiehloudj", "t": "Senior Software Engineer", "co": "Isovalent at Cisco", "im": "https://assets-ext.bizzabo.com/bizzaboprod/image/upload/c_crop,g_custom,f_auto/v1657149311/ah2pnizqmwohzkmimlkb.jpg", "b": "Donia Chaiehloudj is a Senior Software Engineer at Isovalent, where she contributes to the Cilium project, focusing on network policy and cloud-native networking. Her work sits at the intersection of Kubernetes, Linux networking, and eBPF, helping improve how distributed systems are secured and observed at scale. \n\nShe is co-author of Learn Go with Pocket-Sized Projects and has a strong interest in sharing content around Go, networking and eBPF. Donia is also an active member of the developer community, leading a local meetup, organising conferences, serving as a Women Techmakers ambassador and part of the Merge-Forward, a diversity CNCF initiative. Outside of engineering, she enjoys sewing, playing the clarinet, and exploring new hiking trails.", "li": "https://www.linkedin.com/in/donia-chaiehloudj/", "w": "https://www.doniacld.com/"}, {"n": "Ravi Sastry Kadali", "t": "Staff AI/ML Engineer", "co": "General Motors", "im": "https://assets-ext.bizzabo.com/bizzaboprod/image/upload/c_crop,g_custom,f_auto/v1781042463/asya8skolvqscykiknhs.jpg", "b": "Ravi Sastry Kadali is a Staff AI/ML Engineer building infrastructure for autonomous vehicles, with over two decades of experience across platform integrity, API security, and intrusion detection systems. A longtime open-source contributor in the Go ecosystem, he created go-safeinput, SecurePrompt, and cryptoguard-go, and has landed patches in the Go project itself (golang/go), Kubernetes, etcd, gosec, gqlgen, semgrep, OWASP ZAP, Aqua Security's Trivy, and others. His career spans security and platform engineering at Meta, Microsoft, X Corp, Neustar Security Services, and India's Defense Research and Development Organization (DRDO).", "li": "https://www.linkedin.com/in/ravisastryk/", "w": ""}, {"n": "Austin Clements", "t": "Software Engineer", "co": "Google, Go Team", "im": "https://assets-ext.bizzabo.com/bizzaboprod/image/upload/c_crop,g_custom,f_auto/v1780969944/kaisw6drlw1xm256ngzb.jpg", "b": "As the technical lead for the Go programming language, Austin is responsible for the overall technical direction and governance of the Go project. Austin’s tenure at Google spans over a decade, with much of that time dedicated to deep-system contributions, including previously serving as the lead for the Go compiler and runtime. They have a long history with Go, including writing a Go interpreter and debugger as an intern in 2009 and developing Go’s concurrent garbage collector with Rick Hudson in 2015. Their recent focus includes optimizing Go for the latest hardware through projects like the Green Tea garbage collector and native SIMD support, establishing governance structures that serve both Go and the community better, and ensuring Go thrives in a world driven by both human and agentic programming. \n\nAn MIT alumnus with a passion for how programming languages shape thought, Austin balances their work on Go with personal interests in smart home technology, mid-century modern architecture, and the decade-long pursuit of the perfect matcha latte.", "li": "", "w": ""}, {"n": "Ian Alexander", "t": "Software Engineer", "co": "Google, Go Team", "im": "https://assets-ext.bizzabo.com/bizzaboprod/image/upload/c_crop,g_custom,f_auto/v1781058325/welk48bolzbxfmx1mdqg.jpg", "b": "Ian is a software engineer based in NYC, working on the Go Security team at Google.  In his spare time, he is a volunteer firefighter.", "li": "", "w": ""}, {"n": "Vladimir Vivien", "t": "Software Engineer", "co": "Starkite.AI", "im": "https://assets-ext.bizzabo.com/bizzaboprod/image/upload/c_crop,g_custom,f_auto/v1657912577/oxijkz0j15veb7bdnwj0.jpg", "b": "Vladimir Vivien is a software engineer and a technologist who is passionate about working on open source projects using Go.  He is currently building cloud native solutions for the Kubernetes ecosystem and related open source projects. Vladimir has presented at many tech conferences and is also the author of several books including a book on Go titled \"Learning Go Programming\".", "li": "https://www.linkedin.com/in/vvivien/", "w": "https://medium.com/@vladimirvivien"}, {"n": "Robert Griesemer", "t": "Software Engineer", "co": "Google, Go Team", "im": "https://assets-ext.bizzabo.com/bizzaboprod/image/upload/c_crop,g_custom,f_auto/v1783924234/snud8p5ezqnjewyrbnmx.jpg", "b": "Robert is one of the designers of the Go programming language. Before Go, Robert worked on Google's V8 JavaScript engine and the domain-specific language Sawzall. He was a founding member of the team that created the Java HotSpot virtual machine and the Strongtalk system. Currently, Robert is mostly focusing on generics for Go. He likes things that \"just work.\"", "li": "", "w": ""}, {"n": "Dmitri Shuralyov", "t": "Software Engineer", "co": "Google, Go Team", "im": "https://assets-ext.bizzabo.com/bizzaboprod/image/upload/c_crop,g_custom,f_auto/v1719891459/hiafxcpvl8an8lp1nuus.jpg", "b": "Dmitri is a software engineer and an avid gopher. He strives to make software more delightful.\n\nComing from a game development and graphics/UI background where C++ was used predominantly, he discovered and made a full switch to Go 11 years ago, which lead to increased developer happiness.\n\nIn his spare time, he's mostly working on software development tools and exploring experimental ideas. He enjoys contributing to open source, fixing issues in existing tools and the Go project itself.", "li": "", "w": ""}, {"n": "Akshay Shah", "t": "Field CTO", "co": "Antithesis", "im": "https://assets-ext.bizzabo.com/bizzaboprod/image/upload/c_crop,g_custom,f_auto/v1784082325/scvziravyzo4hux7axeu.jpg", "b": "At Antithesis, Akshay helps companies build strong verification gates into software factories. Prior to Antithesis, he’s worked on infrastructure and developer experience at a variety of companies - including leading Uber’s Go team.", "li": "https://linkedin.com/in/akshayjshah", "w": "https://akshayshah.org"}, {"n": "Alexander Baygeldin", "t": "Backend Engineer", "co": "Evil Martians", "im": "https://assets-ext.bizzabo.com/bizzaboprod/image/upload/c_crop,g_custom,f_auto/v1779318193/mcjdvckb6od5dpwjyclp.jpg", "b": "Alexander is a backend engineer at Evil Martians, where he helps startups build modern, scalable, and lasting web applications. Alexander has a passion for crafting clean and maintainable architectures.", "li": "https://www.linkedin.com/in/baygeldin/", "w": "https://www.linkedin.com/in/baygeldin/"}, {"n": "Ruslan Kadyrov", "t": "Senior Software Engineer" ns Lead for Go at Google. Before joining the Go team, Marc worked as a Site Reliability Engineer (SRE), giving him a passion for building distributed systems with a focus on resilience and observability.", "li": "https://www.linkedin.com/in/doughertymarc/", "w": "http://muncus.github.io"}, {"n": "Simon Law", "t": "Member of Technical Staff", "co": "Tailscale", "im": "https://assets-ext.bizzabo.com/bizzaboprod/image/upload/c_crop,g_custom,f_auto/v1784172487/pbbyq1zxovdqsfx87zpl.jpg", "b": "Simon is a software developer at Tailscale, where engineers fearlessly spin up custom internal tools since it’s fast, secure, and easy. Before Tailscale, he has helped software teams wire custom automations to their Salesforce instances, operated and secured one of the world’s largest HBase deployments, and started Developer Tools teams at multiple startups.", "li": "https://www.linkedin.com/in/sfllaw/", "w": "https://www.linkedin.com/in/sfllaw/"}, {"n": "Nicholas Husin", "t": "Software Engineer", "co": "Google, Go Team", "im": "https://assets-ext.bizzabo.com/bizzaboprod/image/upload/c_crop,g_custom,f_auto/v1784239238/xsavc8amvyyqsn2mcpjy.jpg", "b": "", "li": "", "w": ""}, {"n": "Robert Burke", "t": "Distributed Gopher Wrangler", "co": "Google", "im": "https://assets-ext.bizzabo.com/bizzaboprod/image/upload/c_crop,g_custom,f_auto/v1784429981/quavhncdamazqhcg7vtc.jpg", "b": "", "li": "", "w": ""}, {"n": "Katie Hockman", "t": "Software Engineer", "co": "Mercari", "im": "https://assets-ext.bizzabo.com/bizzaboprod/image/upload/c_crop,g_custom,f_auto/v1784431580/omab3vihx8cypmjkttdv.jpg", "b": "Katie has been working with Go since 2018, when she joined the Go team at Google in NYC. Katie was the tech lead for the module mirror and checksum database and worked on the security and cryptography team, where she led the design and implementation for adding native fuzzing to the language. After Google, she led the Go tracing libraries team at Datadog with heavy involvement in OpenTelemetry in \n\nNeil currently lives in Southwest Florida, with his wife, three children, one dog, and three cats.", "li": "https://www.linkedin.com/in/neilprimmer/", "w": ""}, {"n": "Kate Pond", "t": "Chief Ecosystem Officer", "co": "The Pond's Edge", "im": "https://assets-ext.bizzabo.com/bizzaboprod/image/upload/c_crop,g_custom,f_auto/v1755060927/o68ebq1tp7him3fvga7r.jpg", "b": "", "li": "", "w": ""}, {"n": "Zaq Question", "t": "Infra Engineer", "co": "Khan Academy", "im": "https://assets-ext.bizzabo.com/bizzaboprod/image/upload/c_crop,g_custom,f_auto/v1755062984/qfabfgzm1q7oa7gihawb.jpg", "b": "", "li": "", "w": ""}, {"n": "Garrett Denis", "t": "Principal Software Engineer", "co": "Skool", "im": "https://assets-ext.bizzabo.com/bizzaboprod/image/upload/c_crop,g_custom,f_auto/v1755065653/lynxo6coy4dhl50cyvqo.jpg", "b": "Garrett is a Software Engineer at Skool where he works on Go backend services that help people build and find their online community. Previously, he worked on platform teams at IDme, CrowdStrike, and AWS delivering highly-available services at scale. He’s especially interested in developer experience and using tools like CI, linting, and automation to shorten feedback loops and keep code review focused on correctness and maintainability instead of style debates.\n\nOutside of work, Garrett is based in Southern California and is usually looking for an excuse to get outside and away from the screen, whether that’s running, hiking, backpacking, or anything in between.", "li": "https://www.linkedin.com/in/gsdenis/", "w": "https://www.linkedin.com/in/gsdenis/"}, {"n": "Seth Lumnah", "t": "Senior Lead Software Developer", "co": "Capital One", "im": "https://assets-ext.bizzabo.com/bizzaboprod/image/upload/c_crop,g_custom,f_auto/v1755661713/afmtbfkq3s7wax7fr3t2.jpg", "b": "Seth has been a software engineer at Capital One since 2020. He has worked on several major Go-based projects, serves as a Go language lead, and maintains the company's internal Go shared libraries. Seth volunteers as a steward of the Go Community of Practice at Capital One and is passionate about building a feature-rich Go ecosystem.", "li": "http://linkedin.com/in/sethdlumnah", "w": "http://linkedin.com/in/sethdlumnah"}, {"n": "Benji Vesterby", "t": "Founder & Principal Security Engineer", "co": "CodePros", "im": "https://assets-ext.bizzabo.com/bizzaboprod/image/upload/c_crop,g_custom,f_auto/v1690822143/hgfauknteazdbqnoe7bg.jpg", "b": "Benji fell in love with computers when he started early—building PCs, teaching himself to code, and chasing distributed systems, AI, and security. In 2017, he discovered Go at a SANS (SysAdmin, Audit, Network, and Security) conference and attended his first GopherCon a year later. The community’s pragmatism shaped Benji’s approach of shipping real code, measuring outcomes, and sharing what works. Today, he is the founder of and one of the masterminds behind the GopherCon Challenge Series and trains 160+ engineers a year.\n\nOutside of work Benji is a photographer, PADI‑certified SCUBA diver and a relentless bread‑baker chasing the perfect sourdough.", "li": "https://www.linkedin.com/in/benjiv/", "w": "https://codepros.org/blog/"}, {"n": "Derek Parker", "t": "Principal Software Engineer", "co": "Red Hat", "im": "https://assets-ext.bizzabo.com/bizzaboprod/image/upload/c_crop,g_custom,f_auto/v1737075711/oaakizspfsdzyf1btcf8.jpg", "b": "Derek is the creator of Delve, the debugger for the Go programming language, and a contributor to the Go compiler and runtime. He has been developing software for over a decade and has traveled the world speaking at conferences and teaching workshops about debugging.", "li": "https://www.linkedin.com/in/derek-parker-68744a173/", "w": "http://derkthedaring.info"}, {"n": "William Kennedy", "t": "Managing Partner", "co": "Ardan Labs", "im": "https://assets-ext.bizzabo.com/bizzaboprod/image/upload/c_crop,g_custom,f_auto/v1747785874/mtmytcgybisndjigf3bb.jpg", "b": "Bill is a managing partner at Ardan Labs in Miami, Florida. Ardan is a group of passionate engineers and business professionals focused on building and delivering reliable, secure, and scalable solutions. Bill is also the author of Go in Action and the Ultimate Go Notebook, plus the author of over 100 blog posts and articles about Go. Lastly, he is a founding member of GoBridge and the GDN, which are organizations working\nto increase Go adoption through diversity.", "li": "https://www.linkedin.com/in/william-kennedy-5b318778/", "w": "https://www.ardanlabs.com/blog/"}, {"n": "Patricio Whittingslow", "t": "Professional Open Source Maintainer", "co": "TinyGo", "im": "https://assets-ext.bizzabo.com/bizzaboprod/image/upload/c_crop,g_custom,f_auto/v1747786566/zdcpfdblqwmvlzaojcm7.png", "b": "Patricio (a.k.a. Pato) is a mechanical engineer turned Go enthusiast. He has used Go to model the physics of rockets and printed circuit boards, and has applied it in embedded systems for a rocket engine test stand as well as in controlling biological processes involving cell cultures.", "li": "https://www.linkedin.com/in/patriciowhittingslow/", "w": "http://whittileaks.com"}, {"n": "Cory LaNou", "t": "Go Author & Trainer", "co": "Gopher Guides", "im": "https://assets-ext.bizzabo.com/bizzaboprod/image/upload/c_crop,g_custom,f_auto/v1778196402/duojwjwfu5ujc9coj7ec.jpg", "b": "Cory is a full stack technologist with nearly 30 years of professional experience. He began his career at CDW.com in the late 90's, where he helped build one of the world's first ecommerce engines, predating Amazon. He has started several technology companies, including Pulsity, a web consulting firm in the late 90's. From that company, Local Launch, an internet marketing technology company, was formed and later sold to RH Donnelly in 2006. \n\nCory has years of experience in the Go world, having worked on the Core engineering team that contributes to InfluxDB, a highly scalable, distributed time series database written in Go. He has worked on several other Go projects with a focus on profiling and optimizing applications, using advanced profiling concepts such as torch graphs and tracing profiles. He also has deep ties to the Go community, having started one of the very first Go meetups in the world, Denver Gophers, as well as assisting in the very first GopherCon. He has created and led numerous Go workshops and training courses, has published several online articles related to Go, and co-authored \"Go Fundamentals\". Cory is also a partner at Gopher Guides, the industry leader for Go training and conferences.\n\nWhen Cory isn't working on writing new Go training material, he volunteers as a high school AI Programming Club leader. He also volunteers his time helping local entrepreneurs start up their own businesses by offering free business advice and services, such as incorporating their business, getting their web presence set up, and giving them the moral support they need to make their dreams a reality.", "li": "https://www.linkedin.com/in/corylanou/", "w": "https://www.linkedin.com/in/corylanou/"}, {"n": "Johnny Boursiquot", "t": "Principal Software Engineer", "co": "Stable Kernel", "im": "https://assets-ext.bizzabo.com/bizzaboprod/image/upload/c_crop,g_custom,f_auto/v1617233680/yphqebdtyeq40qzjp5kp.jpg", "b": "Johnny is a software engineer specializing in Go, AI engineering, cloud architecture, and distributed systems. He is a Principal Software Engineer at Stable Kernel and co-founder of a cloud-based SaaS platform focused on workforce development. He serves the Go community as a conference Program Chair for GopherCon. His work appears on platforms including O’Reilly, LinkedIn Learning, and Packt.", "li": "https://www.linkedin.com/in/jboursiquot/", "w": ""}, {"n": "Erik St. Martin", "t": "President", "co": "Gopher Academy", "im": "https://assets-ext.bizzabo.com/bizzaboprod/image/upload/c_crop,g_custom,f_auto/v1663875804/hejwbn24s5q0iseuraeh.jpg", "b": "Erik St. Martin spent the last decade building distributed systems for large enterprises such as cable providers, credit bureaus, and fraud detection companies, and now works for Microsoft as a Principal Software Engineer. He co-authored a book on the Go programming language, is the president of Gopher Academy, and emcees GopherCon, the annual conference for the Go community.", "li": "https://www.linkedin.com/in/erikstmartin/", "w": ""}, {"n": "Ron Evans", "t": "Technologist For Hire", "co": "The Hybrid Group", "im": "https://assets-ext.bizzabo.com/bizzaboprod/image/upload/c_crop,g_custom,f_auto/v1716255807/nesrdkxmot2bamqpktva.jpg", "b": "Ron is an award-winning software developer and expert in robotics/IoT/computer vision who is very active in the free and open-source community. He has helped many clients such as AT&T, Intel, Sphero, and Northvolt solve some of their most difficult technical and business problems.\n\nRon is a code contributor to many open-source hardware/software projects and is one of the maintainers of TinyGo (https://tinygo.org), as well as the creator of the open-source IoT/robotics framework Gobot (https://gobot.io), computer vision framework GoCV (https://gocv.io), and embedded WebAssembly framework Mechanoid (https://mechanoid.io)", "li": "https://www.linkedin.com/in/deadprogram/", "w": "https://deadprogrammersociety.com/"}, {"n": "Samantha Kendziora", "t": "Senior Software Engineer", "co": "Diagrid", "im": "https://assets-ext.bizzabo.com/bizzaboprod/image/upload/c_crop,g_custom,f_auto/v1755060268/actdfr7q7h13lkiuzpte.jpg", "b": "Samantha Kendziora is a Senior Software Engineer at Diagrid, where she works on the AI team building developer tooling for autonomous agents and mission-critical workflows. She is a maintainer across the core Dapr ecosystem, a graduated project of the Cloud Native Computing Foundation, including runtime, SDKs, and the Dapr Agents framework (Python) working across both the Go-based runtime and ecosystem integrations. She recently helped drive Dapr Agents to its official, stable v1.0.0 release, shaping APIs and advancing the developer experience for agent-based applications. In addition to her open-source work, Samantha contributes to the Diagrid Catalyst platform, helping evolve Go-based microservices that power scalable, production-grade systems for AI workloads.\n\nPrior to this, she built containerized computer vision applications for healthcare/smart cities and Go microservices for industrial edge environments for naval research. She is a published Go technical author, 2023 Society of Women Engineers Rising Technical Contributor Award recipient, organizer of the Women Who Go meetup in Austin, proud member of several of the Working Groups in the Linux Foundation Agentic AI Foundation (AAIF), and serves on the Texas State University Industry Advisory board as an advocate for empowering early-career and underrepresented engineers.\n\nShe has spoken at major conferences including:\n\n•\t2025 GopherCon US: Go with the (Work)Flow: AI-Driven Code Generation for Workflows\n•\t2024 GHC Level Up Lab (workshop): Spike Your Application Development Skills with Dapr\n•\t2023 OSS: A Guide to Dapr: Open Source APIs & SDKs for Developers\n•\t2022 GopherCon US: A Journey Through Integration Testing with Go - What Could Go Wrong?\n\nOutside of work, Samantha enjoys staying active, working on various house projects, and attending technical events with her family of “gophers,” including her twin sister. She is also currently preparing for her honeymoon after GopherCon in Croatia, Montenegro, Bosnia, and Greece!", "li": "https://www.linkedin.com/in/samantha-kendziora-a038b414a/", "w": "https://www.linkedin.com/in/samantha-kendziora-a038b414a/"}, {"n": "Cameron Balahan", "t": "Group Product Manager", "co": "Google, Go Team", "im": "https://assets-ext.bizzabo.com/bizzaboprod/image/upload/c_crop,g_custom,f_auto/v1747793253/oowdbz6myzrlrvpqvioy.jpg", "b": "Cameron is the product lead for the Go programming language at Google and a contributor to Go
