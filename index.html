<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GopherCon 2026 — Grid Schedule</title>
<style>
  :root {
    --bg: #fbfbfd;
    --panel: #ffffff;
    --ink: #14161a;
    --ink-2: #5b6270;
    --ink-3: #8b929f;
    --line: #e2e5eb;
    --line-2: #eef0f4;
    --accent: #00a29c;
    --shadow: 0 1px 2px rgba(16,20,28,.06), 0 8px 24px rgba(16,20,28,.06);
    --radius: 10px;

    --c-talk: #3b5bdb;      --b-talk: #eaeefc;
    --c-workshop: #b45309;  --b-workshop: #fdf1de;
    --c-community: #0f766e; --b-community: #dcf3f0;
    --c-sponsor: #7c3aed;   --b-sponsor: #f0e9fd;
    --c-food: #5c6673;      --b-food: #eef0f4;
    --c-social: #be185d;    --b-social: #fce8f0;
    --c-ambient: #475569;   --b-ambient: #eaeef3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1013;
      --panel: #171a1f;
      --ink: #e9ebef;
      --ink-2: #a2a9b6;
      --ink-3: #767d8b;
      --line: #2a2f38;
      --line-2: #21262d;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);

      --c-talk: #9db2f7;      --b-talk: #1c2440;
      --c-workshop: #f0b46a;  --b-workshop: #3a2812;
      --c-community: #6ed0c4; --b-community: #0f2f2c;
      --c-sponsor: #c4a6f8;   --b-sponsor: #291b40;
      --c-food: #aeb6c3;      --b-food: #282e37;
      --c-social: #f39bbd;    --b-social: #3a1526;
      --c-ambient: #9aa5b4;   --b-ambient: #222831;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.45 ui-sans-serif, -apple-system, "SF Pro Text", "Segoe UI", Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
  }
  button, select, input { font: inherit; color: inherit; }

  /* ------------------------------------------------------------- chrome */
  header {
    padding: 14px 18px 0; border-bottom: 1px solid var(--line);
    background: var(--panel); flex: 0 0 auto;
  }
  .titlebar { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 17px; font-weight: 650; margin: 0; letter-spacing: -.01em; }
  .sub { color: var(--ink-3); font-size: 12.5px; }
  .sub a { color: var(--ink-3); }

  .bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
  .bar .sep { width: 1px; height: 22px; background: var(--line); margin: 0 2px; }
  .spacer { flex: 1 1 auto; }

  .tabs { display: flex; gap: 2px; background: var(--line-2); padding: 3px; border-radius: 9px; }
  .tab {
    border: 0; background: transparent; cursor: pointer; padding: 6px 11px;
    border-radius: 7px; font-size: 12.5px; font-weight: 550; color: var(--ink-2);
    display: flex; flex-direction: column; align-items: flex-start; line-height: 1.25;
  }
  .tab small { font-size: 10.5px; font-weight: 450; color: var(--ink-3); }
  .tab[aria-selected="true"] { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
  .tab[aria-selected="true"] small { color: var(--accent); }

  select, .btn, .search {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 9px; font-size: 12.5px; cursor: pointer;
  }
  .search { cursor: text; width: 170px; }
  .btn:hover, select:hover { border-color: var(--ink-3); }
  .btn.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  .chips { display: flex; gap: 5px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line); background: var(--panel); border-radius: 999px;
    padding: 4px 10px 4px 8px; font-size: 12px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; user-select: none;
  }
  .chip .dot { width: 9px; height: 9px; border-radius: 3px; background: var(--dot); flex: 0 0 auto; }
  .chip[aria-pressed="false"] { opacity: .38; }
  .chip:hover { border-color: var(--ink-3); }

  .tznote {
    margin: 0 18px 11px; padding: 7px 11px; border-radius: 8px;
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 32%, transparent);
    font-size: 12px; color: var(--ink-2);
  }
  .tznote b { color: var(--ink); }
  .sh { font-style: normal; font-size: .82em; color: var(--accent);
        margin-left: 3px; vertical-align: 1px; font-weight: 700; }

  /* ------------------------------------------------------------- all-day band */
  .allday { padding: 0 18px 12px; }
  .allday h2 {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--ink-3); margin: 0 0 6px; font-weight: 600;
  }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill {
    background: var(--b-ambient); color: var(--c-ambient);
    border: 1px solid transparent; border-left: 3px solid var(--c-ambient);
    border-radius: 6px; padding: 4px 9px; font-size: 11.5px; cursor: pointer;
    display: flex; gap: 7px; align-items: baseline; text-align: left;
  }
  .pill b { font-weight: 600; color: var(--ink); }
  .pill span { font-variant-numeric: tabular-nums; opacity: .85; }
  .pill:hover { border-color: var(--c-ambient); }

  /* ------------------------------------------------------------- grid */
  .scroll { flex: 1 1 auto; overflow: auto; position: relative; }
  .grid {
    display: grid;
    grid-template-columns: 62px repeat(var(--n), minmax(var(--colw), 1fr));
    min-width: max-content; position: relative;
  }
  .gh, .rh {
    position: sticky; background: var(--panel); z-index: 20;
    border-bottom: 1px solid var(--line); border-right: 1px solid var(--line-2);
    padding: 4px 8px; font-size: 11px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis;
  }
  .gh { top: 0; height: 26px; font-weight: 600; letter-spacing: .04em;
        text-transform: uppercase; color: var(--ink-3); font-size: 10px;
        border-bottom-color: var(--line-2); }
  .rh { top: 26px; height: 38px; font-weight: 600; font-size: 12px;
        display: flex; align-items: center; }
  .gh.g0 { color: var(--c-talk); }
  .corner { position: sticky; left: 0; z-index: 30; background: var(--panel); }
  .gh.corner { top: 0; }
  .rh.corner { top: 26px; }

  .gutter {
    position: sticky; left: 0; z-index: 10; background: var(--panel);
    border-right: 1px solid var(--line); height: var(--h);
  }
  .tick {
    position: absolute; right: 6px; font-size: 10.5px; color: var(--ink-3);
    font-variant-numeric: tabular-nums; transform: translateY(-1px); line-height: 1;
  }
  .tick.off::after {
    content: attr(data-off); display: block; font-size: 8.5px; color: var(--accent);
    text-align: right;
  }

  .col {
    position: relative; height: var(--h);
    border-right: 1px solid var(--line-2);
    background:
      repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px var(--hr)),
      repeating-linear-gradient(to bottom, var(--line-2) 0 1px, transparent 1px var(--hhr));
    background-position: 0 0, 0 0;
  }

  .ev {
    position: absolute; overflow: hidden; cursor: pointer; text-align: left;
    border: 1px solid transparent; border-left: 3px solid var(--c);
    background: var(--b); color: var(--ink);
    border-radius: 6px; padding: 3px 6px 3px 7px;
    font-size: 11.5px; line-height: 1.28;
    /* buttons vertically centre their content in the UA stylesheet — override */
    display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start;
  }
  .ev:hover { border-color: var(--c); z-index: 6; box-shadow: var(--shadow); }
  .ev .tm { font-size: 10px; color: var(--c); font-weight: 600;
            font-variant-numeric: tabular-nums; letter-spacing: .01em; }
  .ev .ti { font-weight: 570; display: block; }
  .ev .sk { color: var(--ink-2); font-size: 10.5px; display: block; }
  .ev.dim { opacity: .1; pointer-events: none; }
  .ev.gone { display: none; }
  .ev.tiny { padding: 1px 6px; display: block; white-space: nowrap; z-index: 4; }
  .ev.tiny .tm { display: inline; margin-right: 4px; }
  .ev.tiny .ti { display: inline; }
  .ev.tiny .sk { display: none; }
  .ev .star {
    position: absolute; top: 1px; right: 1px; width: 18px; height: 18px;
    border: 0; background: none; padding: 0; cursor: pointer; line-height: 1;
    font-size: 12px; color: var(--ink-3); opacity: 0; border-radius: 4px;
  }
  .ev:hover .star { opacity: .7; }
  .ev.starred .star { opacity: 1; color: #f0a020; }
  .ev.starred { box-shadow: inset 0 0 0 1.5px #f0a020; }
  .ev .star:hover { opacity: 1 !important; background: rgba(0,0,0,.06); }

  .nowline { position: absolute; left: 0; right: 0; height: 2px; background: #e5484d;
             z-index: 8; pointer-events: none; }

  /* ------------------------------------------------------------- drawer */
  .scrim {
    position: fixed; inset: 0; background: rgba(10,12,16,.42); z-index: 50;
    opacity: 0; pointer-events: none; transition: opacity .16s;
  }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100%);
    background: var(--panel); z-index: 51; overflow-y: auto;
    transform: translateX(100%); transition: transform .2s cubic-bezier(.4,0,.2,1);
    box-shadow: -12px 0 40px rgba(0,0,0,.18); padding: 20px 22px 44px;
  }
  .drawer.open { transform: none; }
  .drawer .x {
    position: sticky; top: -2px; float: right; border: 0; background: var(--panel);
    font-size: 20px; cursor: pointer; color: var(--ink-3); line-height: 1; padding: 2px 4px;
  }
  .drawer .kicker {
    display: inline-block; font-size: 10.5px; font-weight: 650; letter-spacing: .06em;
    text-transform: uppercase; color: var(--c); background: var(--b);
    padding: 3px 8px; border-radius: 5px; margin-bottom: 10px;
  }
  .drawer h3 { font-size: 19px; line-height: 1.3; margin: 0 0 12px; letter-spacing: -.01em; }
  .meta { border-top: 1px solid var(--line-2); padding: 9px 0;
          display: grid; grid-template-columns: 72px 1fr; gap: 10px; font-size: 13px; }
  .meta dt { color: var(--ink-3); font-size: 11.5px; text-transform: uppercase;
             letter-spacing: .04em; padding-top: 2px; }
  .meta dd { margin: 0; font-variant-numeric: tabular-nums; }
  .meta .zone { color: var(--ink-3); font-variant-numeric: normal; }
  .desc { font-size: 13.5px; color: var(--ink-2); margin-top: 14px;
          border-top: 1px solid var(--line-2); padding-top: 12px; }
  .desc p { margin: 0 0 10px; }
  .desc :is(h1,h2,h3,h4) { font-size: 14px; color: var(--ink); margin: 14px 0 6px; }
  .desc img { max-width: 100%; height: auto; border-radius: 8px; }
  .spk { display: flex; gap: 11px; margin-top: 14px; align-items: flex-start; }
  .spk img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover;
             background: var(--line-2); flex: 0 0 auto; }
  .spk .nm { font-weight: 600; font-size: 13.5px; }
  .spk .rl { color: var(--ink-3); font-size: 12px; }
  .spk .bio { color: var(--ink-2); font-size: 12.5px; margin-top: 5px;
              max-height: 4.6em; overflow: hidden; cursor: pointer; }
  .spk .bio.open { max-height: none; }
  .spk a { color: var(--accent); font-size: 12px; text-decoration: none; }

  .empty { padding: 40px; text-align: center; color: var(--ink-3); }

  @media print {
    header .bar, .scroll { overflow: visible; }
    .tabs, .btn, .search, select, .star { display: none !important; }
    .scroll { max-height: none; }
  }
</style>
</head>

<script>
const DATA = {"days": [{"d": "2026-08-03", "label": "Mon 3 Aug", "note": "Pre-conference", "main": false, "cols": [{"r": "Off-site venues", "g": "Evening & Off-site"}], "start": 1080, "end": 1200}, {"d": "2026-08-04", "label": "Tue 4 Aug", "note": "Workshops + Community Day", "main": false, "cols": [{"r": "MR 431", "g": "Workshops (separate ticket)"}, {"r": "MR 432", "g": "Workshops (separate ticket)"}, {"r": "MR 433", "g": "Workshops (separate ticket)"}, {"r": "MR 434", "g": "Workshops (separate ticket)"}, {"r": "MR 435", "g": "Workshops (separate ticket)"}, {"r": "MR 438", "g": "Workshops (separate ticket)"}, {"r": "MR 427", "g": "Community Day"}, {"r": "MR 428–429", "g": "Community Day"}, {"r": "MR 437", "g": "Community Day"}, {"r": "MR 439", "g": "Community Day"}, {"r": "Terrace Suite", "g": "Community Day"}, {"r": "Paramount Lounge", "g": "Food & Breaks"}, {"r": "Off-site venues", "g": "Evening & Off-site"}], "start": 420, "end": 1260}, {"d": "2026-08-05", "label": "Wed 5 Aug", "note": "Conference Day 1", "main": true, "cols": [{"r": "Finneran Ballroom 2", "g": "Main Stage"}, {"r": "MR 437", "g": "Sponsor Sessions"}, {"r": "Signature Lounge area", "g": "Food & Breaks"}, {"r": "Off-site venues", "g": "Evening & Off-site"}], "start": 480, "end": 1320}, {"d": "2026-08-06", "label": "Thu 6 Aug", "note": "Conference Day 2", "main": false, "cols": [{"r": "Finneran Ballroom 2", "g": "Main Stage"}, {"r": "MR 437", "g": "Sponsor Sessions"}, {"r": "Signature Lounge area", "g": "Food & Breaks"}], "start": 480, "end": 1080}], "sessions": [{"i": 1803565, "t": "Registration", "s": 1785783600000, "e": 1785801600000, "sm": 720, "em": 1020, "d": "2026-08-03", "r": "Paramount Lounge", "rf": "Paramount Lounge, Level 4, SCC | Summit", "c": "ambient", "g": "Main Stage", "sp": [], "x": ""}, {"i": 1801553, "t": "Women Who Go Meetup 💃🏻", "s": 1785805200000, "e": 1785812400000, "sm": 1080, "em": 1200, "d": "2026-08-03", "r": "Off-site venues", "rf": "Hyatt Regency Seattle VIP Lounge, 8th Floor", "c": "social", "g": "Evening & Off-site", "sp": [[44, "Host"], [42, "Host"], [30, "Host"]], "x": "<p><em><strong>This gathering is included in your conference pass. If you are interested in attending, please&nbsp;</strong></em><a href=\"https://forms.gle/fHuQeNCQiLrxSm9w7\" rel=\"noopener noreferrer\" target=\"_blank\"><em><strong>register your interest</strong></em></a> <em><strong>so we can expect you.&nbsp;</strong></em></p><p>Calling All Women Who Go! After a long travel day for most of us, we're keeping this gathering simple. Join us in the Hyatt Regency's VIP Lounge for some light bites and beverages while you get to know your fellow women who go professionally, and personally. ☀️ </p>"}, {"i": 1801555, "t": "Registration", "s": 1785850200000, "e": 1785889800000, "sm": 390, "em": 1050, "d": "2026-08-04", "r": "Paramount Lounge", "rf": "Paramount Lounge, Level 4, SCC | Summit", "c": "ambient", "g": "Main Stage", "sp": [], "x": ""}, {"i": 1801561, "t": "Hallway Track", "s": 1785850200000, "e": 1785889800000, "sm": 390, "em": 1050, "d": "2026-08-04", "r": "Terrace Suite", "rf": "Terrace Suite & Lobby, Level 4, SCC | Summit", "c": "ambient", "g": "Main Stage", "sp": [], "x": "<p>Some say this is where the magic happens at GopherCon! Join your fellow Gophers for some informal socializing and networking between or during sessions, and find out for yourself. 😊</p>"}, {"i": 1801554, "t": "Morning Coffee Break", "s": 1785852000000, "e": 1785866400000, "sm": 420, "em": 660, "d": "2026-08-04", "r": "Paramount Lounge", "rf": "Paramount Lounge & Terrace Suite Lobby, Level 4", "c": "food", "g": "Food & Breaks", "sp": [], "x": "<p>Freshly Brewed Regular and Decaffeinated Coffee<br>Hot Water with Assorted Teas <br>Served with Soy Milk, 2%, Skim, and Half &amp; Half, as well as assorted sweeteners</p>"}, {"i": 1801560, "t": "Full-Day Workshop: Ultimate Private AI (requires a separate ticket)", "s": 1785855600000, "e": 1785888000000, "sm": 480, "em": 1020, "d": "2026-08-04", "r": "MR 431", "rf": "Meeting Room 431, Level 4, SCC | Summit", "c": "workshop", "g": "Workshops (separate ticket)", "sp": [[36, "Instructor"]], "x": "<p><strong>Level:</strong> Intermediate</p><p><strong>Description:</strong> Model servers are critical to any AI solution today, but many applications don't need the power, or cost, of cloud-based inference. A private model server tailored to your specific problem can work just as well, if not better, while being less expensive to run and deploy. Better still, build an application that interacts with models directly, with no server at all!</p><p><br>&nbsp;Projects like <a href=\"https://github.com/hybridgroup/yzma\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>Yzma</strong></a> and <a href=\"https://github.com/ardanlabs/kronk\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>Kronk</strong></a> make this a reality. Learn to write software that interacts with open-source models directly. Build your own model server when you need one. Use the Kronk SDK for hardware-accelerated local inference with llama.cpp integrated directly into your Go applications via Yzma - no CGO required.</p><p><strong>What You'll Learn</strong></p><ul><li>Use llama.cpp libraries directly in Go applications via the Yzma project</li><li>Build robust Go applications that interact with open-source models from Hugging Face via Kronk</li><li>Build a model server with an OpenAI-compatible chat completions API for tailored needs</li></ul><p><strong>Hardware Requirements</strong></p><ul><li>A Mac M1 series with at least 16 GB RAM (preferably 32GB+),</li><li>or any Linux/Windows laptop with a dedicated GPU with at least 8GB VRAM (not system ram; preferably 16GB),</li><li>or access to a cloud-based instance with a dedicated GPU with at least 8GB VRAM (preferably 16GB).</li></ul><p><strong>Prerequisites</strong></p><ul><li>It is expected that you will have been coding in Go for several months.</li><li>A working Go environment running on the device you will be bringing to class.</li></ul><p><strong>Recommended Preparation</strong></p><ul><li>Please <a href=\"https://github.com/ardanlabs/kronk\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>clone</strong></a> the main repo for the class.</li><li>Please read the notes in the makefile for installing all the tooling and testing the code before class.</li><li>Please <a href=\"mailto:bill@ardanlabs.com\"><strong>email</strong></a> the instructor, Bill Kennedy, for assistance.</li></ul>"}, {"i": 1801558, "t": "Full-Day Workshop: Ultimate Practical AI (requires a separate ticket)", "s": 1785855600000, "e": 1785888000000, "sm": 480, "em": 1020, "d": "2026-08-04", "r": "MR 432", "rf": "Meeting Room 432, Level 4, SCC | Summit", "c": "workshop", "g": "Workshops (separate ticket)", "sp": [[46, "Instructor"]], "x": "<p><strong>Level:</strong> Intermediate</p><p><strong>Description:</strong> AI is everywhere in our workflows now, and that raises the bar for us as Go developers. The tools are powerful - but we still have to ship code that works and keep up with a field that moves fast. How do we do both?</p><p>This workshop is the story of how I figured that out. I started as a skeptic who thought these models were just glorified autocomplete. What changed my mind was learning to treat the model like a pair programmer: an engineer who writes Go incredibly fast, but who has zero feel for the business or the context. That's where you come in - the human in the loop.</p><p>For the agent work, we won't be working on toy code. We'll use the <a href=\"http://github.com/ardanlabs/service\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>ArdanLabs Service</strong></a> example as our real application - a production-style codebase that gives the agent real architecture to navigate instead of a hello-world demo.</p><p>I'll show you the things I actually do day to day:</p><ul><li><strong>Context engineering</strong> - getting the right information in front of the agent, and how I work with AGENTS.md/CLAUDE.md.&nbsp;</li><li><strong>Skills</strong> - the ArdanLabs Go development skills I rely on, and how to figure out which ones are worth building for your own work.&nbsp;</li><li><strong>Code reviews and walkthroughs</strong> - putting the agent to work understanding and critiquing code.&nbsp;</li><li><strong>Testing</strong> - leaning on the agent for integration and black-box testing.&nbsp;</li><li><strong>Features and refactoring</strong> - adding to existing code and giving it a proper structure.&nbsp;</li></ul><p>Structure is what makes or breaks a project in a world of agents. The Service example shows you what good structure looks like - but most real code isn't there yet. So we'll practice the fix: take a deliberately messy, unstructured project and work through restructuring it together, until the agent is noticeably better at working with it than when we started. You'll leave with a process you can take straight back to your own codebase.</p><p>For the rest, we'll work in standalone examples, small self-contained pieces of code you can lift out and reuse:</p><ul><li><strong>RAG</strong> - connecting the service to a model and feeding it your own data with retrieval.&nbsp;</li><li><strong>Tool calling and function execution</strong> - letting the model call real Go functions to hit APIs, query databases, and trigger workflows.&nbsp;</li><li><strong>MCP</strong> - exposing those tools the standard way, with a simple MCP server in Go.&nbsp;</li><li><strong>Optimizations</strong> - speculative decoding, semantic caching, and model routing, the things that make it fast enough to ship.&nbsp;</li><li><strong>Security</strong> - &nbsp;how to reason about the attack vectors these systems open up, from prompt injection to data exfiltration, with a hands-on look at some practical uses of LLMs in security.</li></ul><p><strong>What a s<span style=\"font-family: Tahoma,Geneva,sans-serif;\">tudent is expected to</span> learn</strong></p><p>A repeatable way to put an agent to work on a Go codebase - and the judgment to know when to trust it, when to steer it, and how to set up your projects so it can do its best work.</p><p><strong>Prerequisites</strong></p><p>You'll bring access to a frontier model - Anthropic, OpenAI, or any other provider with a state-of-the-art model. If you'd rather run locally, we'll use Kronk with the Qwen 3.6 35B A3B model. None of this is mandatory, but having access to a frontier model gives you the best experience - part of the skill is learning to adapt to whatever model you're given.</p><ul><li>Access to a frontier model, or a local setup as described below.</li><li>Direct access to hardware which can run the workshop will be provided during the class. All the code will be OpenAI-compatible and you can run this against any environment, from <a href=\"https://www.kronkai.com/\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>Kronk</strong></a> to AWS Bedrock or Vertex AI and anything in-between.</li><li>It is expected that you will have been coding in Go for several months.</li><li>Have a functioning<a href=\"https://golang.org/dl/\" rel=\"noopener noreferrer\" target=\"_blank\">&nbsp;<strong>Go environment</strong></a> installed with Go 1.26 or later.</li></ul><p><strong>Recommended Preparation</strong></p><ul><li>Before the workshop, you’ll be asked to clone a repository that will be shared with you ahead of time.</li><li>Please read the README.md for installing all the tooling before class.</li><li>The repository will contain some of the code that we’ll work on during the class.</li><li>It’s recommended that you run<a href=\"https://docs.docker.com/get-docker/\">&nbsp;<strong>Docker</strong></a> or any other container runtime as some of the dependencies will be downloaded in that format.</li><li>To save on the bandwidth, and not rely on Internet access during the workshop, the repository will direct you on how to download and cache the models required to run the class.</li><li>Please <a href=\"mailto:florin.patan@ardanlabs.com\"><strong>email</strong></a> the instructor,Florin Pățan, for assistance.</li></ul>"}, {"i": 1801570, "t": "Half-Day Workshop: Go Concurrency: Debugging Goroutines and Channels (requires a separate ticket)", "s": 1785855600000, "e": 1785870000000, "sm": 480, "em": 720, "d": "2026-08-04", "r": "MR 433", "rf": "Meeting Room 433, Level 4, SCC | Summit", "c": "workshop", "g": "Workshops (separate ticket)", "sp": [[35, "Instructor"]], "x": "<p><strong>Level:</strong> All Attendees</p><p><strong>Description:</strong> Debugging concurrent Go applications can be tricky. This is especially true in the AI Agentic coding era where more and more code is being written by the AI Agent, and the engineer plays the architect/design/review/debug roles instead. Having a solid foundation in investigative and debugging techniques, using the latest tools, becomes even more essential for the modern software engineer.</p><p>All kinds of problems can arise when concurrency and parallelism are thrown into the mix, whether it's performance bottlenecks, deadlocks, race conditions, or any other number of potential issues. Go does a lot to mitigate these issues at the language level, making concurrency easy to reason about. However, despite the convenience and ease of use afforded to us by the language, often times you may still find yourself hunting down an elusive bug involving multiple goroutines.</p><p>This workshop will dive into how to debug goroutines and channels, one of the most powerful yet complex features of Go. During the course of this workshop, you will learn how to utilize the built-in features of the Go toolchain such as the race detector and tracing tool, as well as external tools like Delve. We will learn how to use these various tools by fixing actual bugs in real time. Following each section, there will be a final Go program exhibiting a similar bug and we’ll see how the techniques we just learned can be utilized to fix the issue.</p><p><strong>What You’ll Learn</strong></p><p>This course is appropriate for all attendees but may be somewhat advanced for a complete beginner. Students will learn how to leverage the various tools available from the Go toolchain, standard library and beyond in order to solve their complex bugs involving multiple goroutines.</p><p><strong>Prerequisites</strong></p><p>A basic understanding of the Go programming language. Students do not have to be expert Go users, but they will get the most from the workshop if they are at least comfortable writing Go programs and have experience using Go’s concurrency mechanisms such as goroutines and channels.</p><p><strong>Recommended Preparation</strong></p><ul><li>Install and configure an editor for Go.</li><li>Install <a href=\"https://github.com/go-delve/delve\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>Delve</strong></a> locally.</li><li>Have a functioning <a href=\"https://go.dev/dl/\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>Go environment</strong></a> installed with Go 1.24 or later.</li><li>Have a <a href=\"https://github.com/go-delve/delve\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>GitHub</strong></a> account.</li><li>Computers should be capable of modern software development, such as access to install and run binaries, install a code editor, etc.</li><li>Please <a href=\"mailto:derekparker86@gmail.com\"><strong>email</strong></a> the instructor, Derek Parker, for assistance.</li></ul><p><br></p>"}, {"i": 1801556, "t": "Half-Day Workshop: Agents the Hard Way: Building Agentic Systems in Go (requires a separate ticket)", "s": 1785855600000, "e": 1785870000000, "sm": 480, "em": 720, "d": "2026-08-04", "r": "MR 434", "rf": "Meeting Room 434, Level 4, SCC | Summit", "c": "workshop", "g": "Workshops (separate ticket)", "sp": [[39, "Instructor"]], "x": "<p><strong>Level:</strong> Advanced</p><p><strong>Description:</strong> LLMs make it easy to generate code and call APIs. Turning those calls into reliable, agentic systems is harder. Hidden state, runaway loops, hallucinated actions, and opaque frameworks introduce operational risk that doesn’t disappear just because a model is involved.</p><p>This workshop takes a framework-free approach to building agentic systems in Go. We treat agents as explicit, goal-driven state machines where the LLM acts as a constrained decision component—not the system itself. Over four hours, participants will evolve a simple LLM-backed task into a controlled agent loop, implementing core building blocks by hand: state, actions, planning, execution, validation, retries, and termination conditions.</p><p>We introduce skills as capability boundaries that limit what an agent is allowed to do, and demonstrate how those skills can be backed by local Go functions or remote tools via the Model Context Protocol (MCP)—without changing the agent’s control flow. Along the way, we examine common failure modes and add guardrails to make these systems observable, testable, and safe to operate.</p><p>This workshop is designed for Go engineers who already use LLMs and want to move beyond one-off model calls toward production-ready agentic workflows they fully understand and control.</p><p><strong>What You'll Learn</strong></p><ul><li>A practical mental model for agents as goal-driven state machines</li><li>Concrete Go patterns for implementing agent loops without frameworks</li><li>How to design and enforce skills as explicit capability boundaries</li><li>How to integrate MCP-backed tools while retaining control in Go</li><li>Techniques to prevent infinite loops, hallucinated actions, and runaway costs</li></ul><p><strong>Prerequisites</strong></p><ul><li>Familiarize yourself with Go fundamentals (<a href=\"https://go.dev/tour/welcome/1\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>Go Tour</strong></a>, <a href=\"https://gobyexample.com/\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>Go by Example</strong></a>)&nbsp;</li><li>Introduce yourself to<strong>&nbsp;</strong><a href=\"https://opentelemetry.io/docs/what-is-opentelemetry/\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>OpenTelemetry</strong></a> (optional, but recommended)</li><li>Introduce yourself to LLMs concepts and basic <a href=\"https://www.anthropic.com/engineering/building-effective-agents\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>Agentic concepts</strong></a><strong>&nbsp;</strong></li></ul><p><strong>Recommended Preparation</strong></p><ul><li>Have a<a href=\"https://github.com/\" rel=\"noopener noreferrer\" target=\"_blank\"> <strong>GitHub</strong></a> account</li><li>Have an&nbsp;OpenAI,&nbsp;Anthropic, or AWS account (using Bedrock to route LLM calls) for remote LLMs</li><li>Have an AWS account and the<a href=\"https://aws.amazon.com/cli/\" rel=\"noopener noreferrer\" target=\"_blank\"> <strong>awscli</strong></a> configured locally (the free tier AWS provides will fit with the services we will use)</li><li>Install Ollama and pgvector - see <a href=\"https://gist.github.com/jboursiquot/59a1050718b8600848ffe17ec56b46cb\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>detailed instructions</strong></a></li><li>Install<a href=\"https://docs.docker.com/get-docker/\" rel=\"noopener noreferrer\" target=\"_blank\"> <strong>Docker</strong></a></li><li>Have a functioning<a href=\"https://golang.org/dl/\" rel=\"noopener noreferrer\" target=\"_blank\"> <strong>Go environment</strong></a> installed with Go 1.26+</li><li>Use an editor/IDE with Go plugin installed</li><li>Please <a href=\"mailto:jboursiquot@gmail.com\"><strong>email</strong></a> the instructor, Johnny Boursiquot, for assistance.</li></ul>"}, {"i": 1801557, "t": "Half-Day Workshop: Profiling and Optimizing Go Programs (requires a separate ticket)", "s": 1785855600000, "e": 1785870000000, "sm": 480, "em": 720, "d": "2026-08-04", "r": "MR 435", "rf": "Meeting Room 435, Level 4, SCC | Summit", "c": "workshop", "g": "Workshops (separate ticket)", "sp": [[38, "Instructor"]], "x": "<p><strong>Level:</strong> Intermediate</p><p><strong>Description:</strong> Go ships with amazing profiling tools, but understanding how and when to use them, as well as understanding their output can be quite challenging.</p><p>This course was designed to take experienced Go developers and show them how to install, configure, and run the tools. &nbsp;We will start with benchmarking to give us an idea of how to use the tools. Then we will work with small programs and begin to learn how to not only spot performance issues, but also how to correct them and verify the performance increases.</p><p><strong>What You'll Learn</strong></p><ul><li>Introduction and in-depth look at benchmarking, including creating benchmarks and running profiles against them.</li><li>Install, configure, and run the pprof tools provided by Google.</li><li>Learn about the different profiles that pprof can create, when to use them, and how to read the output of each.</li><li>Generate profiles from live/running programs.</li><li>Learn about torch graphs and how to read them.</li><li>Students will cover several common performance mistakes that Go developers make learning how to spot and correct them.</li></ul><p><strong>Some of what you’ll work on during the workshop</strong></p><ul><li>Write benchmarks for basic code samples and create profiles to determine how to increase performance.</li><li>Generate profiles and torch graphs against live running HTTP services to determine bottlenecks and increase performance.</li><li>Profile and debug a command line program that handles large amounts of text, and ultimately determine the bottlenecks and refactor that code to be more performant.</li></ul><p><strong>Prerequisites</strong></p><ul><li>Familiarize yourself with Go fundamentals (<a href=\"https://go.dev/tour/welcome/1\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>Go Tour</strong></a><strong>,&nbsp;</strong><a href=\"https://gobyexample.com/\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>Go by Example</strong></a>)&nbsp;</li><li>Have familiarity with testing in Go</li></ul><p><strong>Recommended Preparation</strong></p><ul><li>Have a<a href=\"https://github.com/\" rel=\"noopener noreferrer\" target=\"_blank\">&nbsp;<strong>GitHub</strong></a> account</li><li>Have a functioning<a href=\"https://golang.org/dl/\" rel=\"noopener noreferrer\" target=\"_blank\">&nbsp;<strong>Go environment</strong></a> installed with Go 1.25 or later</li><li>Use an editor/IDE with Go plugin installed</li><li>Computer should be capable of modern software development, such as access to install and run binaries, install a code editor, etc.</li><li>Please <a href=\"mailto:cory@gopherguides.com\"><strong>email</strong></a> the instructor, Cory LaNou, for assistance.</li></ul>"}, {"i": 1920062, "t": "Half-Day Workshop: eBPF + Go: Build Network Observability Tools Your Team Actually Needs (requires a separate ticket)", "s": 1785855600000, "e": 1785870000000, "sm": 480, "em": 720, "d": "2026-08-04", "r": "MR 438", "rf": "Meeting Room 438, Level 4, SCC | Summit", "c": "workshop", "g": "Workshops (separate ticket)", "sp": [[7, "Instructor"], [28, "Instructor"]], "x": "<p><strong>Level:</strong> Intermediate</p><p><strong>Description:</strong> Developers own their services end-to-end in cloud-native orgs, but their visibility stops at the application boundary. Everything below the kernel networking stack, the container runtime, the CNI is a black box they depend on but can't observe. When something breaks in that layer, developers are stuck waiting on someone else.</p><p>eBPF changes that. It lets you attach programs directly to the Linux networking stack to observe traffic, measure latency, and trace failures without modifying application code, adding sidecars, or filing a ticket to the infra team.</p><p>This workshop teaches Go developers the foundational knowledge to work with eBPF and the Linux networking stack, then puts it to work. You'll build a real network observability tool in Go from scratch, using the cilium/ebpf library with bpf2go to stay in Go the entire time, no C required. Along the way, you'll develop an intuition for how packets move through the kernel, where things break, and how tools like Cilium, Hubble, and Tetragon are built under the hood.</p><p>You'll leave with a working tool and a new set of skills that combine eBPF, networking, and Go into something you can apply immediately, whether that's building developer tooling, debugging production issues, or contributing to cloud-native infrastructure projects.</p><p dir=\"ltr\"><strong>Who This Workshop is For</strong></p><ul><li aria-level=\"1\" dir=\"ltr\"><p dir=\"ltr\">Go developers who build cloud-native tooling (operators, CLIs, service mesh components, CNI plugins, security tools) and want to build with eBPF, not just consume it</p></li><li aria-level=\"1\" dir=\"ltr\"><p dir=\"ltr\">SRE-developers who write Go and want to add kernel-level network visibility to their skillset</p></li><li aria-level=\"1\" dir=\"ltr\"><p dir=\"ltr\">Developers who want the foundational knowledge to understand and contribute to projects like Cilium</p></li></ul><p><strong>What You’ll Learn</strong></p><ul><li aria-level=\"1\" dir=\"ltr\"><p dir=\"ltr\">A working network observability tool written entirely in Go</p></li><li aria-level=\"1\" dir=\"ltr\"><p dir=\"ltr\">Foundational understanding of how the Linux networking stack affects your services</p></li><li aria-level=\"1\" dir=\"ltr\"><p dir=\"ltr\">Practical eBPF skills you can apply to your own tooling immediately</p></li></ul><p><strong>Prerequisites</strong></p><ul><li aria-level=\"1\" dir=\"ltr\"><p dir=\"ltr\">Comfortable writing Go</p></li><li aria-level=\"1\" dir=\"ltr\"><p dir=\"ltr\">Basic understanding of networking concepts (TCP/IP, DNS, ports, sockets)</p></li><li aria-level=\"1\" dir=\"ltr\"><p dir=\"ltr\">Familiarity with Kubernetes concepts (pods, services, namespaces)</p></li><li aria-level=\"1\" dir=\"ltr\"><p dir=\"ltr\">No prior eBPF or kernel experience required</p></li><li aria-level=\"1\" dir=\"ltr\"><p dir=\"ltr\">Optional: read the cilium/ebpf Getting Started guide (https://ebpf-go.dev/)</p></li></ul><p><strong>Recommended Preparation</strong></p><ul><li aria-level=\"1\" dir=\"ltr\"><p dir=\"ltr\">Have a <a href=\"https://github.com/\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>GitHub</strong></a> account</p></li><li aria-level=\"1\" dir=\"ltr\"><p dir=\"ltr\">Install <a href=\"https://docs.docker.com/get-docker/\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>Docker</strong></a> and <a href=\"https://kind.sigs.k8s.io/docs/user/quick-start/#installation\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>Kind</strong></a> for local Kubernetes clusters</p></li><li aria-level=\"1\" dir=\"ltr\"><p dir=\"ltr\">Have a functioning<a href=\"https://golang.org/dl/\" rel=\"noopener noreferrer\" target=\"_blank\">&nbsp;<strong>Go environment</strong></a> installed with Go 1.26+</p></li><li aria-level=\"1\" dir=\"ltr\"><p dir=\"ltr\">Use an editor/IDE with Go plugin installed</p></li><li aria-level=\"1\" dir=\"ltr\"><p dir=\"ltr\">Clone the <a href=\"https://github.com/doniacld/gc26-ebpf-go\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>workshop repository</strong></a> and follow the installation steps</p></li><li aria-level=\"1\" dir=\"ltr\"><p dir=\"ltr\">Please <a href=\"mailto:donia.cld@gmail.com\"><strong>email</strong></a> the instructor, Donia Chaiehloudj, for assistance.</p></li></ul>"}, {"i": 1837790, "t": "Community Day: Challenge Series Safari - An Introduction to the Competition", "s": 1785855600000, "e": 1785870000000, "sm": 480, "em": 720, "d": "2026-08-04", "r": "MR 439", "rf": "Meeting Room 439, Level 4, SCC | Summit", "c": "community", "g": "Community Day", "sp": [[29, "Instructor"]], "x": "<p><strong>Level:&nbsp;</strong>Beginner+</p><p><strong>Description:&nbsp;</strong>The Challenge Series is a set of logical, programming, and security puzzles designed to help software engineers of any experience level flex their (figurative) muscles, while having the opportunity to forge new connections and win prizes.</p><p>The <strong>first hour (8a – 9a)</strong> of this workshop will be focused on walking you through the registration process, team development, and gaining a deeper understanding of the nuts and bolts of the Challenge Series.</p><p>The remainder of the workshop aims to provide a guided introduction to participating in the Challenge Series. We’ll spend this time diving into real challenges from this year’s competition. We will not only delve into how to solve the challenges, but what went into designing and building the various challenges, and how the provided hints tie into the solution.</p><p>Whether you’ve participated in every Challenge Series or you’re curious to try it out for the first time, this workshop will give you plenty of insight to hit the ground running! And, better yet, challenges completed during the workshop will count towards the competition as a whole and <a href=\"https://gophercon.challengeseries.org/prizes\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>prize</strong></a> eligibility. As many as seven Challenge Flags may be earned during the course of this workshop!</p><p><strong>What You’ll Learn</strong></p><p><em>Challenge Series’ Overview</em></p><ul><li>How to register and participate</li><li>How to solve some of our challenges, including one that has gone completely unsolved for three years running</li><li>How we design challenges and incorporate hints into those challenges</li></ul><p><em>Application Security</em></p><ul><li>How to inspect frontend application code and storage for potential vulnerabilities</li><li>How to manipulate frontend applications to leverage vulnerabilities</li></ul><p><em>Docker</em></p><ul><li>How to inspect Docker containers for potential vulnerabilities</li><li>How to utilize the Docker command-line tool and container specification to leverage vulnerabilities</li></ul><p><em>Application Development</em></p><ul><li>How to establish a connection to a remote system over websockets</li><li>How to send and receive data over websockets</li></ul><p><strong>Prerequisites</strong></p><ul><li>Some experience in troubleshooting technical issues, such as debugging</li><li>Some experience in reading and writing code, even if it isn’t Go</li><li>Comfort with some level of running commands in shell</li><li>No specific prior Go knowledge is required; beginners are welcome and encouraged to join</li></ul><p><strong>What You’ll Need</strong></p><ul><li>An interactive shell (bash or zsh recommended)</li><li>Go (1.24+ Recommended), or another programming language toolchain of your choice</li><li>Docker or Docker Desktop</li><li>An IDE or Editor (VS Code Recommended)</li><li>A browser with developer console access (Firefox Recommended)</li><li>Ability to install or run new software and binaries, ability to pull and run docker containers.</li></ul><p><strong>Recommended Preparation</strong></p><ul><li>Register for the Challenge Series at <a href=\"https://gophercon.challengeseries.org\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>https://gophercon.challengeseries.org</strong></a></li><li>Join the #gophercon-cs channel in Gophers slack</li><li>Have a GitHub or GitLab account</li><li>Please <a href=\"mailto:neil@codepros.org\"><strong>email</strong></a> the instructor, Neil Primmer, for assistance.</li></ul>"}, {"i": 1801562, "t": "Contributors' Summit (by invitation only)", "s": 1785859200000, "e": 1785870000000, "sm": 540, "em": 720, "d": "2026-08-04", "r": "MR 427", "rf": "Meeting Room 427, Level 4, SCC | Summit", "c": "community", "g": "Community Day", "sp": [[13, "Host"], [23, "Host"]], "x": "<p>The Go Contributor Summit is an opportunity for active Go contributors to gather together, discuss issues, and get face time with some of the Go Team and project contributors who can attend. This event is by invitation only; please find more information at <a href=\"https://groups.google.com/g/golang-dev/c/O45RfPZFV6g/m/WIfQIzDNBAAJ\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>here</strong></a>.&nbsp;</p>"}, {"i": 1801564, "t": "Community Day: TinyGo Hardware Hack Session", "s": 1785859200000, "e": 1785884400000, "sm": 540, "em": 960, "d": "2026-08-04", "r": "MR 428–429", "rf": "Meeting Rooms 428 & 429, Level 4, SCC | Summit", "c": "community", "g": "Community Day", "sp": [[41, "Host"], [37, "Host"]], "x": "<p><img src=\"https://s3.amazonaws.com/bizzabo.users.files/4GqqWX6iTVCtIDC6ua9H_TinyGo%20TASA%20Logo.png\" style=\"width: 150px; display: block; vertical-align: top; margin: 5px auto 5px 0px; text-align: left;\"></p><p>The TinyGo Hardware Hack Session Is Getting Ready For Takeoff!<br><br>We are getting ready to Go where no Gopher has gone before... will you join us?<br><br>Become part of the TinyGo Aeronautics and Space Alliance (TASA) and get your devices ready for takeoff.<br><br>From tiny wireless devices, to our selection of drones and robots, we will be making things move using our favorite language.<br><br>You bring your laptop and sense of wonder, we will bring a collection of hardware you can borrow, along with a few special surprises.<br><br>Don't miss this unique and fun chance to take control over the robots and show that with Go, the sky is no longer the limit!</p><p><br></p>"}, {"i": 1801563, "t": "Challenge Series: Welcome to the Jungle!", "s": 1785859200000, "e": 1785884400000, "sm": 540, "em": 960, "d": "2026-08-04", "r": "Terrace Suite", "rf": "Terrace Suite, Level 4, SCC | Summit", "c": "ambient", "g": "Main Stage", "sp": [[29, "Host"], [34, "Host"], [44, "Host"], [42, "Host"], [22, "Host"]], "x": "<p><em><strong>This activity is included in your conference pass. <em><strong>Interested in participating? Contestant&nbsp;</strong></em></strong></em><a href=\"https://gophercon.challengeseries.org/\" rel=\"noopener noreferrer\" target=\"_blank\"><em><strong><em><strong>registration</strong></em></strong></em></a><em><strong><em><strong>&nbsp;is now open!</strong></em></strong></em></p><p>Whether it's a Unix system that you (think) you know, the magic word that you forgot to say, or some amphibian DNA that corrupted your DNS - There's no end to the potential problems you might need to solve for this year's Challenge Series!&nbsp;</p><p>Focused on the world of Jurassic Park, your expedition to Isla Nublar will give you the opportunity to fix power outages, run from a T-Rex, and help security doors become secure once more. As with every year, we'll have an array of <a href=\"https://gophercon.challengeseries.org/prizes\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>prizes</strong></a> for all of you dinosaur-wranglers to fight over - Just don't let the dinosaurs fight over you instead. </p><p>While every contestant has the chance to win some prizes, the most competitive are the ones who hunt their challenges like a pack of velociraptors. And finally, don't forget to pack your can of Barbasol, you'll need something to bring your prized dinosaur embryos home in.&nbsp;</p><p>Be clever. Win prizes.</p><p>Keep an eye out in the&nbsp;<a href=\"https://gophers.slack.com/archives/C0528UE9X\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>#gophercon</strong></a> and&nbsp;<a href=\"https://gophers.slack.com/archives/C05KD83LQD8\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>#gophercon-cs</strong></a> channels in Gophers Slack for more updates up to and through the conference.</p>"}, {"i": 1801565, "t": "Community Day: Collaborative Roundtables", "s": 1785859200000, "e": 1785884400000, "sm": 540, "em": 960, "d": "2026-08-04", "r": "Terrace Suite", "rf": "Terrace Suite, Level 4, SCC | Summit", "c": "community", "g": "Community Day", "sp": [], "x": "<p>This is your opportunity to meet and collaborate with other community members who share an interest in the same topics and open-source projects as you. Whiteboards will have a list of numbers that correspond with each table. Choose an open table, write your topic next to the corresponding number on the whiteboard, and gather with your fellow Gophers in an informal, welcoming, and open environment!</p>"}, {"i": 1801566, "t": "Grab n' Go Lunch", "s": 1785870000000, "e": 1785875400000, "sm": 720, "em": 810, "d": "2026-08-04", "r": "Paramount Lounge", "rf": "Paramount Lounge & Terrace Suite Lobby, Level 4", "c": "food", "g": "Food & Breaks", "sp": [], "x": "<p><strong>Picnic Bento Boxes&nbsp;</strong></p><p>Grilled BBQ Chicken Bento Box - BBQ Chicken over a bed of Rainbow Cabbage Slaw | Roasted Potato Salad with Peppers, Walla Walla Onions, and Red Wine Vinaigrette | Fruit Salad | Gluten-free Chocolate Chip Cookie &nbsp;<strong>GF |&nbsp;</strong><strong>NF</strong></p><p>Grilled BBQ Pork Tenderloin Bento Box - BBQ Pork Tenderloin over a bed of Rainbow Cabbage Slaw | Roasted Potato Salad with Peppers, Walla Walla Onions, and Red Wine Vinaigrette | Fruit Salad | Gluten-free Chocolate Chip Cookie &nbsp;<strong>GF |&nbsp;</strong><strong>NF</strong></p><p>Grilled BBQ Tofu Bento Box - BBQ Tofu over a bed of Rainbow Cabbage Slaw | Roasted Potato Salad with Peppers, Walla Walla Onions, and Red Wine Vinaigrette | Fruit Salad | Grape Bunch &nbsp;<strong>GF | V |&nbsp;</strong><strong>NF</strong></p><p>Assorted Sodas and Canned Water</p><p><br></p>"}, {"i": 1801567, "t": "Community Day: Meet the Go Team", "s": 1785873600000, "e": 1785884400000, "sm": 780, "em": 960, "d": "2026-08-04", "r": "MR 427", "rf": "Meeting Room 427, Level 4, SCC | Summit", "c": "community", "g": "Community Day", "sp": [], "x": "<p data-end=\"1090\" data-start=\"809\">One of the best parts of GopherCon is connecting with the people who build and support the Go ecosystem. During Community Day, members of the Go Team will be available to meet attendees, answer questions, discuss current and future work on Go, and hear directly from the community.</p><p data-end=\"1273\" data-start=\"1092\">Whether you're looking for technical insight, curious about the project's direction, or simply want to say hello, stop by anytime during the session. We look forward to meeting you!</p>"}, {"i": 1801559, "t": "Half-Day Workshop: Security Threat Modeling for Go Developers (requires a separate ticket)", "s": 1785873600000, "e": 1785888000000, "sm": 780, "em": 1020, "d": "2026-08-04", "r": "MR 433", "rf": "Meeting Room 433, Level 4, SCC | Summit", "c": "workshop", "g": "Workshops (separate ticket)", "sp": [[34, "Instructor"]], "x": "<p><strong>Level:</strong> Intermediate</p><p><strong>Description:&nbsp;</strong>One leaked database password. Four hours later, full admin access. This workshop shows you how attackers chain exploits, and how to stop them.</p><p>Using a real Go web application, you will go through the process of evaluating a real-world-like system, identifying, summarizing, and classifying the risks, vulnerabilities, and threats. Using an assumed breach scenario starting with a single stolen credential, you will then trace how one piece of vital information can pivot into broader data access and overall system compromise. Go applications in production environments have a large number of dependencies that increase their threat landscape when deployed, and as applications age, those dependencies and linkages only grow larger.</p><p>You will also learn to create and analyze data flow diagrams, identify trust boundaries, and map out attack paths – then design practical mitigations that can be implemented in their own systems. The scenario will include external services not under the control of the developer’s team or company for a real-world application of threat modeling. This ensures that the training includes black-box threat modeling as part of the exercise and deployment/development of compensating controls. Throughout this exercise, we'll use the STRIDE (Spoofing, Tampering, Repudiation, Information Disclosure, Denial of Service, Elevation of Privilege) framework for systematic threat identification, build attack trees to visualize exploit chains, and apply risk matrices to prioritize what to fix first.</p><p>Whether you've never heard of threat modeling or done it informally for years, the goal of this workshop is to give you a framework for thinking about security in your own systems.</p><p><strong>What You'll Learn</strong></p><p><em>Threat Modeling Fundamentals</em></p><ul><li>What threat modeling is and why developers should own it</li><li>Clear understanding of Vulnerability vs Threat vs Risk</li><li>Using the STRIDE framework to systematically identify threats</li><li>Creating and reading data flow diagrams (DFDs)</li><li>Identifying trust boundaries and attack surfaces</li><li>Mapping Identified Risks / Vulnerabilities and Weaknesses of MITRE</li></ul><p><em>Attack Trees</em></p><ul><li>How attack trees complement STRIDE by mapping how threats are realized</li><li>Visualizing attack chains from initial compromise to objective</li><li>Identifying prerequisites and dependencies in attack paths</li></ul><p><em>Credential Compromise Analysis</em></p><ul><li>Types of credentials and their “blast radius”</li><li>Mapping lateral movement paths from a single compromised credential</li><li>Understanding privilege escalation opportunities</li><li>Identifying sensitive data exposure risks</li></ul><p><em>Prioritization &amp; Mitigation</em></p><ul><li>Using risk matrices to prioritize threats</li><li>Implementing the principle of least privilege in practice</li><li>Secrets management and rotation strategies</li><li>Defense in depth for credential compromise</li></ul><p><strong>Prerequisites</strong></p><ul><li>Basic understanding of three-tier web application architecture</li><li>Familiarity with various credential types, such as API keys, tokens, passwords, and connection strings</li><li>Comfort reading and understanding architecture diagrams</li></ul><p><strong>What You'll Need</strong></p><ul><li>An IDE or Editor (VS Code Recommended)</li><li>Have a functioning<a href=\"https://golang.org/dl/\" rel=\"noopener noreferrer\" target=\"_blank\">&nbsp;<strong>Go environment</strong></a> installed with Go 1.24+</li><li><a href=\"https://docs.docker.com/get-docker/\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>Docker</strong></a> or Docker Desktop with Docker Compose support</li><li>A tool for diagramming (Notebooks and pens will be provided, but use what you’re most comfortable with)</li><li>A browser with developer console access (Firefox recommended)</li></ul><p><strong>Recommended Preparation</strong></p><ul><li>Clone the example repository</li><li>Ensure you’re able to start, and stop, the docker-composed file in the root of the repository</li><li>Please <a href=\"mailto:benji@codepros.org\"><strong>email</strong></a> the instructor, Benji Vesterby,<a href=\"mailto:bill@ardanlabs.com\"></a> for assistance.</li></ul>"}, {"i": 1845040, "t": "Half-Day Workshop: Agents the Hard Way: Building Agentic Systems in Go (requires a separate ticket)", "s": 1785873600000, "e": 1785888000000, "sm": 780, "em": 1020, "d": "2026-08-04", "r": "MR 434", "rf": "Meeting Room 434, Level 4, SCC | Summit", "c": "workshop", "g": "Workshops (separate ticket)", "sp": [[39, "Instructor"]], "x": "<p><strong>Level:</strong> Advanced</p><p><strong>Description:</strong> LLMs make it easy to generate code and call APIs. Turning those calls into reliable, agentic systems is harder. Hidden state, runaway loops, hallucinated actions, and opaque frameworks introduce operational risk that doesn’t disappear just because a model is involved.</p><p>This workshop takes a framework-free approach to building agentic systems in Go. We treat agents as explicit, goal-driven state machines where the LLM acts as a constrained decision component—not the system itself. Over four hours, participants will evolve a simple LLM-backed task into a controlled agent loop, implementing core building blocks by hand: state, actions, planning, execution, validation, retries, and termination conditions.</p><p>We introduce skills as capability boundaries that limit what an agent is allowed to do, and demonstrate how those skills can be backed by local Go functions or remote tools via the Model Context Protocol (MCP)—without changing the agent’s control flow. Along the way, we examine common failure modes and add guardrails to make these systems observable, testable, and safe to operate.</p><p>This workshop is designed for Go engineers who already use LLMs and want to move beyond one-off model calls toward production-ready agentic workflows they fully understand and control.</p><p><strong>What You'll Learn</strong></p><ul><li>A practical mental model for agents as goal-driven state machines</li><li>Concrete Go patterns for implementing agent loops without frameworks</li><li>How to design and enforce skills as explicit capability boundaries</li><li>How to integrate MCP-backed tools while retaining control in Go</li><li>Techniques to prevent infinite loops, hallucinated actions, and runaway costs</li></ul><p><strong>Prerequisites</strong></p><ul><li>Familiarize yourself with Go fundamentals (<a href=\"https://go.dev/tour/welcome/1\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>Go Tour</strong></a>, <a href=\"https://gobyexample.com/\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>Go by Example</strong></a>)&nbsp;</li><li>Introduce yourself to<strong>&nbsp;</strong><a href=\"https://opentelemetry.io/docs/what-is-opentelemetry/\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>OpenTelemetry</strong></a> (optional, but recommended)</li><li>Introduce yourself to LLMs concepts and basic <a href=\"https://www.anthropic.com/engineering/building-effective-agents\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>Agentic concepts</strong></a><strong>&nbsp;</strong></li></ul><p><strong>Recommended Preparation</strong></p><ul><li>Have a<a href=\"https://github.com/\" rel=\"noopener noreferrer\" target=\"_blank\">&nbsp;<strong>GitHub</strong></a> account</li><li>Have an&nbsp;OpenAI,&nbsp;Anthropic, or AWS account (using Bedrock to route LLM calls) for remote LLMs</li><li>Have an AWS account and the<a href=\"https://aws.amazon.com/cli/\" rel=\"noopener noreferrer\" target=\"_blank\">&nbsp;<strong>awscli</strong></a> configured locally (the free tier AWS provides will fit with the services we will use)</li><li>Install Ollama and pgvector - see <a href=\"https://gist.github.com/jboursiquot/59a1050718b8600848ffe17ec56b46cb\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>detailed instructions</strong></a></li><li>Install<a href=\"https://docs.docker.com/get-docker/\" rel=\"noopener noreferrer\" target=\"_blank\">&nbsp;<strong>Docker</strong></a></li><li>Have a functioning<a href=\"https://golang.org/dl/\" rel=\"noopener noreferrer\" target=\"_blank\"> <strong>Go environment</strong></a> installed with Go 1.26+</li><li>Use an editor/IDE with Go plugin installed</li><li>Please <a href=\"mailto:jboursiquot@gmail.com\"><strong>email</strong></a> the instructor, Johnny Boursiquot, for assistance.</li></ul>"}, {"i": 1849790, "t": "Half-Day Workshop: Agentic Go Development: Orchestrate AI to Work Like You (requires a separate ticket)", "s": 1785873600000, "e": 1785888000000, "sm": 780, "em": 1020, "d": "2026-08-04", "r": "MR 435", "rf": "Meeting Room 435, Level 4, SCC | Summit", "c": "workshop", "g": "Workshops (separate ticket)", "sp": [[38, "Instructor"]], "x": "<p><strong>Level:</strong> Intermediate/Advanced</p><p><strong>Description:</strong> Stop prompting. Start orchestrating. This hands-on workshop teaches the agentic approach to Go development where you plan, delegate to AI agents, and review. You will configure Claude Code and Codex to follow your conventions, build custom skills that encode your workflows, set up hooks for automated validation, and execute a complete issue-to-PR workflow. By the end of this class, your AI agents will code like you do!</p><p><strong>Note:</strong> The world of AI can change drastically from one day to the next, completely upending what you knew the day before. This curriculum will be updated to reflect the current state of AI tooling at the time of delivery. The core workflow and principles will remain the same, but specific tools, features, and best practices will match what is available on the day we teach.</p><p><strong>Expected Outcomes</strong></p><ul><li>Understand the agentic workflow: plan, delegate, and review</li><li>Configure Claude Code AND Codex and know when to use each</li><li>Build custom skills that encode your development patterns</li><li>Set up hooks for automated validation and formatting</li><li>Execute a complete issue-to-PR workflow using trained agents</li><li>Train agents to follow YOUR conventions, not generic patterns</li></ul><p><strong>Prerequisites</strong></p><ul><li>Intermediate Go experience (1+ years)</li><li>A functioning<a href=\"https://golang.org/dl/\">&nbsp;<strong>Go environment</strong></a> installed with Go 1.25 or later</li></ul><p><strong>Recommended Preparation</strong></p><ul><li>Have a<a href=\"https://github.com/\">&nbsp;<strong>GitHub</strong></a> account&nbsp;</li><li>Install <a href=\"https://github.com/anthropics/claude-code\"><strong>Claude Code</strong></a>, <a href=\"https://github.com/openai/codex\"><strong>Codex CLI</strong></a>, and/or <a href=\"https://github.com/google-gemini/gemini-cli\"><strong>Gemini CLI</strong></a></li><li>Install <a href=\"https://golangci-lint.run/docs/welcome/install/local/\"><strong>golangci-lint</strong></a></li><li>Computer should be capable of modern software development, such as access to install and run binaries, install a code editor, etc.</li><li>Please <a href=\"mailto:cory@gopherguides.com\"><strong>email</strong></a> the instructor, Cory LaNou, for assistance.&nbsp;</li></ul>"}, {"i": 1934830, "t": "Community Day: Build an AI Agent To Order a Cupcake (and Get One, Too!)", "s": 1785873600000, "e": 1785880800000, "sm": 780, "em": 900, "d": "2026-08-04", "r": "MR 437", "rf": "Meeting Room 437, Level 4, SCC | Summit", "c": "community", "g": "Community Day", "sp": [[51, "Host"], [26, "Host"]], "x": "<p>In this fun, self-paced hands-on workshop, <strong>you'll build an AI agent in Go using the Microsoft Agent Framework for Go</strong>. You'll connect it to a model deployed in Microsoft Foundry and enable it to interact with an MCP server hosted in Azure. Through a series of guided steps, you'll learn how agents connect to external tools and services to discover cupcake flavors, check inventory, and place orders.</p><p><strong>Seats are limited and available on a first-come, first-served basis</strong>, so be sure to arrive early and secure your spot. Cupcakes will be provided to workshop participants while supplies last.&nbsp;</p><p>Come learn how to build intelligent agents, connect them to real-world services, and enjoy a sweet reward for your success! 🧁</p>"}, {"i": 1915531, "t": "Half-Day Workshop: Linux System Programming in Go (requires a separate ticket)", "s": 1785873600000, "e": 1785888000000, "sm": 780, "em": 1020, "d": "2026-08-04", "r": "MR 438", "rf": "Meeting Room 438, Level 4, SCC | Summit", "c": "workshop", "g": "Workshops (separate ticket)", "sp": [[11, "Instructor"]], "x": "<p><strong>Level:</strong> Intermediate</p><p><strong>Description:</strong>&nbsp;</p><p>Go has become one of the dominant languages for programming Linux systems and infrastructures. Projects like Kubernetes, containerd, Cilium, Prometheus, and the broader CNCF ecosystem use Go's ease of use to program Linux directly at the system level.</p><p>This workshop explores the functionalities available in Go to program Linux subsystems directly: from using the unsafe package to translate kernel C structs, controlling Linux devices with ioctl system calls, using zero-copy shared memory with mmap, to launching containerized processes with namespaces and cgroups - all within your Go programs.</p><p>The target audience for this workshop includes Go engineers who want to understand how Go programs interact with their Linux systems and those interested in using Go to create programs that access the kernel or control local devices.</p><p><strong>What You'll Learn</strong></p><ul><li>Using the unsafe package to convert and access C data structures</li><li>Properly constructing ioctl to control Linux devices</li><li>Tracing and debugging system calls</li><li>Using mmap to map memory for zero-copy data access</li><li>Containerized process creation and management</li></ul><p><strong>Prerequisites</strong></p><ul><li>Knowledge of the Go programming language</li><li>Some familiarity with the CGo feature in Go</li><li>Access to a Linux machine (VM or otherwise)</li><li>Access to a <a href=\"https://github.com/\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>GitHub</strong></a> account</li></ul><p><strong>Recommended Preparation</strong></p><ul><li>While you can cross-compile, it is recommended to have access to a Linux machine with Go properly setup or WSL2 (Windows)</li><li>An account with sudo</li><li>Install packages linux-libc-dev, strace, drwarves&nbsp;</li><li>Please <a href=\"mailto:vladimir.vivien@gmail.com\"><strong>email</strong></a> the instructor, Vladimir Vivien, for assistance.</li></ul>"}, {"i": 1801571, "t": "Afternoon Break", "s": 1785880800000, "e": 1785884400000, "sm": 900, "em": 960, "d": "2026-08-04", "r": "Paramount Lounge", "rf": "Paramount Lounge & Terrace Suite Lobby, Level 4", "c": "food", "g": "Food & Breaks", "sp": [], "x": "<p>Freshly Brewed Regular and Decaffeinated Coffee<br>Hot Water with Assorted Teas<br>Served with Soy Milk, 2%, Skim, and Half &amp; Half, as well as assorted sweeteners</p><p>Assorted Sodas and Sparkling Waters</p><p>Fruit-Infused Water</p>"}, {"i": 1801572, "t": "Meetup Organizers (past, present, and future) Unite! 💪", "s": 1785884400000, "e": 1785891600000, "sm": 960, "em": 1080, "d": "2026-08-04", "r": "Off-site venues", "rf": "The Pine Box, 1600 Melrose Avenue", "c": "social", "g": "Evening & Off-site", "sp": [[44, "Host"], [42, "Host"], [34, "Host"]], "x": "<p><em><strong>This gathering is included in your conference pass. If you are interested in attending, please&nbsp;</strong></em><a href=\"https://forms.gle/nPkfBdJCmtDSzJJY7\" rel=\"noopener noreferrer\" target=\"_blank\"><em><strong>register your interest</strong></em></a> <a href=\"https://forms.gle/n8GyzBgCi2nVKGoM9\" rel=\"noopener noreferrer\" target=\"_blank\"></a><em><strong>so we can expect you.</strong></em></p><p>Are you a meetup organizer or someone interested in starting or reviving a meetup in your area? Join us at The Pine Box for a casual evening of connection, conversation, and community-building with fellow organizers.</p><p>Housed in a beautifully restored historic chapel in the heart of Capitol Hill, The Pine Box offers a one-of-a-kind setting with soaring ceilings, stained glass windows, and plenty of character. It's the perfect backdrop for swapping tips, tricks, best practices, and maybe a few meetup war stories too. 😉</p><p>Whether you're a seasoned organizer or just getting started, come share ideas, make new connections, and get inspired by the people who help bring the Go community together all year long. 🍻✨</p><p><br></p>"}, {"i": 1801598, "t": "Asian Alliance Meetup 🌸", "s": 1785891600000, "e": 1785898800000, "sm": 1080, "em": 1200, "d": "2026-08-04", "r": "Off-site venues", "rf": "Ba Bar Capitol Hill, 550 12th Avenue", "c": "social", "g": "Evening & Off-site", "sp": [[22, "Host"], [17, "Host"], [5, "Host"]], "x": "<p><em><strong>This gathering is included in your conference pass. If you are interested in attending, please&nbsp;</strong></em><a href=\"https://forms.gle/nPkfBdJCmtDSzJJY7\" rel=\"noopener noreferrer\" target=\"_blank\"><em><strong>register your interest</strong></em></a> <a href=\"https://forms.gle/n8GyzBgCi2nVKGoM9\" rel=\"noopener noreferrer\" target=\"_blank\"></a><em><strong>so we can expect you.</strong></em></p><p>Asian Alliance invites attendees who identify as Asian or as part of the Asian diaspora to join us at Ba Bar Capitol Hill and connect with the Asian community of Gophers. The original Ba Bar location opened on Capitol Hill in 2011 where sibling founders, Eric and Sophie Banh, built the concept around the Vietnamese street-food flavors they grew up with in Saigon. Named in honor of their father, Ba Bar is a casual, lively Seattle favorite known for pho, vermicelli, crispy imperial rolls, craft cocktails, and housemade nonalcoholic drinks.&nbsp;</p><p><span data-contrast=\"none\" lang=\"EN-US\">Join us and connect as you&nbsp;</span><span data-contrast=\"none\" lang=\"EN-US\">get to know your fellow Asian Gophers, share common experiences, and forge paths to help empower each other in our community!&nbsp;</span><span data-contrast=\"none\" lang=\"EN-US\">💚</span></p>"}, {"i": 1801599, "t": "United Go Meetup 🫱🏾‍🫲🏽", "s": 1785891600000, "e": 1785898800000, "sm": 1080, "em": 1200, "d": "2026-08-04", "r": "Off-site venues", "rf": "Gold Coast Kitchen, 1009 Boren Avenue", "c": "social", "g": "Evening & Off-site", "sp": [[39, "Host"], [27, "Host"], [11, "Host"]], "x": "<p><em><strong>This gathering is included in your conference pass. If you are interested in attending, please&nbsp;</strong></em><a href=\"https://forms.gle/nPkfBdJCmtDSzJJY7\" rel=\"noopener noreferrer\" target=\"_blank\"><em><strong>register your interest</strong></em></a> <a href=\"https://forms.gle/n8GyzBgCi2nVKGoM9\" rel=\"noopener noreferrer\" target=\"_blank\"></a><em><strong>so we can expect you.</strong></em></p><p>United Go strives to create a space for attendees who identify as BIPOC [Black, Indigenous, Hispanic, or a Person of Color] to come together, socialize, and build community.&nbsp;</p><p>This year's gathering will be hosted at a unique West African restaurant, Gold Coast Kitchen. Executive Chef/Owner Tina Fahnbulleh grew up between Liberia and Ghana, at her grandmothers' sides in the kitchen. After the civil force forced her family to leave everything they knew, every meal felt like a reunion, a reminder that food can hold people together when the world doesn’t.&nbsp;</p><p>After starting over in the United States in 2001, Tina eventually ended up in Seattle, and for the first time, those familiar foods were nowhere to be found. So she did what felt most natural: she started cooking and hosting dinner parties. And from those tables, Gold<strong>&nbsp;</strong>Coast<strong>&nbsp;</strong>Kitchen was born.&nbsp;</p><p>Tonight, United Go will come together around this warm and inviting cuisine - the perfect way to connect!</p>"}, {"i": 1801573, "t": "Neurospicy Meetup 🧠", "s": 1785895200000, "e": 1785902400000, "sm": 1140, "em": 1260, "d": "2026-08-04", "r": "Off-site venues", "rf": "SPIN Seattle, 1511 6th Avenue", "c": "social", "g": "Evening & Off-site", "sp": [[54, "Host"], [24, "Host"], [40, "Host"]], "x": "<p><em><strong>This gathering is included in your conference pass. If you are interested in attending, please&nbsp;</strong></em><a href=\"https://forms.gle/nPkfBdJCmtDSzJJY7\" rel=\"noopener noreferrer\" target=\"_blank\"><em><strong>register your interest</strong></em></a> <a href=\"https://forms.gle/n8GyzBgCi2nVKGoM9\" rel=\"noopener noreferrer\" target=\"_blank\"></a><em><strong>so we can expect you.</strong></em></p><p>Do you identify as neurodivergent? Join us at SPIN Seattle and connect with fellow spicy Gophers over games, conversation, and whatever topic currently has your brain in a chokehold!</p><p>SPIN is more than just ping pong; it's a playful, high-energy space designed for connection, friendly competition, and a little bit of organized chaos. Whether you're showing off your paddle skills, cheering from the sidelines, or diving deep into a conversation about your latest interest, you'll find your people here.</p><p>Come as you are and enjoy an evening of games, laughter, shared experiences, and community with fellow neurospicy Gophers. 💚</p>"}, {"i": 1801575, "t": "Registration & Gopher Gear Shop", "s": 1785940200000, "e": 1785978000000, "sm": 450, "em": 1080, "d": "2026-08-05", "r": "Signature Lounge area", "rf": "Signature Lounge, Level 5, SCC | Summit", "c": "ambient", "g": "Main Stage", "sp": [], "x": ""}, {"i": 1934831, "t": "Microsoft Azure + GitHub Lounge", "s": 1785942000000, "e": 1785976200000, "sm": 480, "em": 1050, "d": "2026-08-05", "r": "MR 437", "rf": "Meeting Room 437, Level 4, SCC | Summit", "c": "ambient", "g": "Main Stage", "sp": [], "x": "<p>Take a break and connect with the experts! Visit the Microsoft Azure + GitHub Lounge to speak with Microsoft specialists, explore the latest innovations, relax and recharge, and enjoy complimentary sweet treats throughout the event.</p><p><strong>Don't miss our hands-on workshop today from 1:00 p.m. - 3:00 p.m.</strong></p><p><strong><em>** Seats are limited and available on a first-come, first-served basis**</em></strong></p><p>Whether you're looking for technical guidance, product insights, or a place to recharge between sessions, the Microsoft Azure + GitHub Lounge is your destination. We look forward to seeing you there!</p>"}, {"i": 1803668, "t": "Challenge Series: Welcome to the Jungle!", "s": 1785942000000, "e": 1785974400000, "sm": 480, "em": 1020, "d": "2026-08-05", "r": "Olympic View Lounge", "rf": "Olympic View Lounge, Level 5, SCC | Summit", "c": "ambient", "g": "Main Stage", "sp": [[29, "Host"], [34, "Host"], [44, "Host"], [42, "Host"], [22, "Host"]], "x": "<p><em><strong>This activity is included in your conference pass. <em><strong>Interested in participating? Contestant&nbsp;</strong></em></strong></em><a href=\"https://gophercon.challengeseries.org/\" rel=\"noopener noreferrer\" target=\"_blank\"><em><strong><em><strong>registration</strong></em></strong></em></a><em><strong><em><strong>&nbsp;is now open!</strong></em></strong></em></p><p>Whether it's a Unix system that you (think) you know, the magic word that you forgot to say, or some amphibian DNA that corrupted your DNS - There's no end to the potential problems you might need to solve for this year's Challenge Series!&nbsp;</p><p>Focused on the world of Jurassic Park, your expedition to Isla Nublar will give you the opportunity to fix power outages, run from a T-Rex, and help security doors become secure once more.&nbsp;As with every year, we'll have an array of&nbsp;<a href=\"https://gophercon.challengeseries.org/prizes\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>prizes</strong></a> for all of you dinosaur-wranglers to fight over - Just don't let the dinosaurs fight over you instead.&nbsp;</p><p>While every contestant has the chance to win some prizes, the most competitive are the ones who hunt their challenges like a pack of velociraptors. And finally, don't forget to pack your can of Barbasol, you'll need something to bring your prized dinosaur embryos home in.&nbsp;</p><p>Be clever. Win prizes.</p><p>Keep an eye out in the <a href=\"https://gophers.slack.com/archives/C0528UE9X\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>#gophercon</strong></a> and <a href=\"https://gophers.slack.com/archives/C05KD83LQD8\" rel=\"noopener noreferrer\" target=\"_blank\"><strong>#gophercon-cs</strong></a> channels in Gophers Slack for more updates up to and through the conference.</p>"}, {"i": 1801579, "t": "Hallway Track", "s": 1785942000000, "e": 1785976200000, "sm": 480, "em": 1050, "d": "2026-08-05", "r": "Overlook / Olympic View", "rf": "Overlook & Olympic View, Level 5, SCC | Summit", "c": "ambient", "g": "Main Stage", "sp": [], "x": "<p>Some say this is where the magic happens at GopherCon! Join your fellow Gophers for some informal socializing and networking between or during sessions, and find out for yourself. 😊</p>"}, {"i": 1801576, "t": "Coffee with the Exhibitors", "s": 1785942000000, "e": 1785949200000, "sm": 480, "em": 600, "d": "2026-08-05", "r": "Signature Lounge area", "rf": "Signature Lounge/Lobby/Room, Level 5, SCC | Summit", "c": "food", "g": "Food & Breaks", "sp": [], "x": "<p>Freshly Brewed Regular and Decaffeinated Coffee<br>Hot Water with Assorted Teas<br>Served with Soy Milk, 2%, Skim, and Half &amp; Half, as well as assorted sweeteners</p>"}, {"i": 1801578, "t": "GopherCon Exhibition", "s": 1785942000000, "e": 1785976200000, "sm": 480, "em": 1050, "d": "2026-08-05", "r": "Signature Lounge area", "rf": "Signature Lounge/Lobby/Room, Level 5, SCC | Summit", "c": "ambient", "g": "Main Stage", "sp": [], "x": ""}, {"i": 1801580, "t": "Welcome Gophers!", "s": 1785945600000, "e": 1785945900000, "sm": 540, "em": 545, "d": "2026-08-05", "r": "Finneran Ballroom 2", "rf": "Finneran Ballroom 2, Level 5, SCC | Summit", "c": "talk", "g": "Main Stage", "sp": [[39, "Emcee"], [40, "Emcee"]], "x": ""}, {"i": 1801612, "t": "Towards Go 1.∞", "s": 1785945900000, "e": 1785947400000, "sm": 545, "em": 570, "d": "2026-08-05", "r": "Finneran Ballroom 2", "rf": "Finneran Ballroom 2, Level 5, SCC | Summit", "c": "talk", "g": "Main Stage", "sp": [[9, "Keynote"]], "x": "<p>In a period of profound industry disruption, the path forward for Go is grounded in unwavering commitment to its technical foundations. Go serves as a steady hand on the tiller, not by ignoring change, but by responding to it through the lens of its core principles: simplicity, reliability, efficiency, and longevity. This talk explores how we ensure Go outlasts us, thriving in this moment and into the future, remaining familiar while meeting the demands of the next decade.</p><p>The interconnected needs of human developers and coding agents are the weave and weft of the Go platform’s evolution. By combining a developer experience grounded in tools that serve developers and agents in tandem with language advancements like generic methods, json/v2, and SIMD support, we are ensuring the Go platform continues to thrive for general-purpose software engineering while also positioning Go as an ideal foundation for building high-performance AI systems.</p><p>Simultaneously, we are securing the longevity of the Go project itself by adopting a more open and scalable technical governance model that diversifies project stewardship and bridges the gap between Google and Go’s contributor community. This involves formalizing a robust contributor ladder and granting greater privileges to proven maintainers. Central to this transition is increasing the transparency of the Go proposal process through a more community-driven model, ensuring Go’s evolution remains a collaborative effort while maintaining the project’s high quality and compatibility bar.</p><p>By grounding our response to this era of disruption in Go’s core principles, we are ensuring that both the Go platform and the Go project have the foundations to thrive. Through technical excellence and open stewardship, we are building an enduring ecosystem designed to stand the test of time and remain a foundational engine for software engineering.</p><p><strong>Talk/Attendee Level</strong>: All Attendees</p>"}, {"i": 1880570, "t": "Loosening the Reins: Go Generics Get More Flexible", "s": 1785947700000, "e": 1785949200000, "sm": 575, "em": 600, "d": "2026-08-05", "r": "Finneran Ballroom 2", "rf": "Finneran Ballroom 2, Level 5, SCC | Summit", "c": "talk", "g": "Main Stage", "sp": [[56, "Speaker"]], "x": "<p>Most Go developers learned generics when Go 1.18 shipped and haven’t thought much about them since. Fair enough. The syntax hasn’t changed much. But under the hood, recent Go releases have steadily relaxed some of the restrictions that made useful generic patterns awkward or impossible.</p><p>This talk explores the most important changes through Go 1.26, including generic type aliases, the removal of “co
